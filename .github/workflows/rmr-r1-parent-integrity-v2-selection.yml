name: rmr-r1-parent-integrity-v2-selection

on:
  push:
    branches:
      - codex/rmr-r1-specialist-v2-20260908
    paths:
      - 'scripts/run_rmr_R1_parent_integrity_v2_selection.py'
      - 'tests/test_rmr_R1_parent_integrity_v2_selection.py'
      - 'docs/governance/reversal_mean_reversion_R1_parent_integrity_v2_selection_protocol_v1.json'
      - 'docs/governance/reversal_mean_reversion_R1_parent_integrity_v2_selection_execution_freeze_v1.json'
      - '.github/workflows/rmr-r1-parent-integrity-v2-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-r1-specialist-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Run R1 specialist synthetic and boundary tests
        run: python -m pytest -q tests/test_rmr_R1_parent_integrity_v2_selection.py
      - name: Execute frozen representation selection
        run: |
          python scripts/run_rmr_R1_parent_integrity_v2_selection.py \
            --parquet data/high_open_dev_2015_2025/1m_official.parquet \
            --receipt /tmp/r1v2_selection_receipt.json \
            --parameter-freeze /tmp/r1v2_parameter_freeze.json
      - name: Verify holdout remains sealed and candidate budget exact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/r1v2_selection_receipt.json').read_text())
          assert r['source']['max_day'] <= '2022-12-31'
          assert r['source']['rows_2023_or_later'] == 0
          assert r['holdout_2023_2025_opened'] is False
          assert r['all_2026_rows_opened'] is False
          assert r['candidate_order'] == ['R1_PARENT_COMPOSITE_1D', 'R1_PARENT_ORIGINAL_3D']
          assert r['severity_definition'] == 'abs(lower_wave_move)/DEV_median_rvol20'
          assert r['candidate_addition_or_reordering_performed'] is False
          assert r['scale_or_threshold_search_performed'] is False
          assert r['model_or_hyperparameter_search_performed'] is False
          assert r['trading_return_used'] is False
          if r['selected_candidate_id'] is not None:
              f = json.loads(Path('/tmp/r1v2_parameter_freeze.json').read_text())
              assert f['selected_candidate_id'] == r['selected_candidate_id']
              assert f['holdout_window']['opened_during_refit'] is False
              assert f['production_authority'] is False
          print('R1 specialist selection boundaries preserved')
          PY
      - name: Upload compact selection artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: rmr-r1-parent-integrity-v2-selection
          path: |
            /tmp/r1v2_selection_receipt.json
            /tmp/r1v2_parameter_freeze.json
          if-no-files-found: warn
