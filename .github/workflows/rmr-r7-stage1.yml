name: rmr-r7-stage1

on:
  push:
    branches:
      - codex/rmr-r7-directional-asymmetry-20260908
    paths:
      - 'scripts/run_rmr_R7_stage1.py'
      - 'tests/test_rmr_R7_stage1.py'
      - 'docs/governance/reversal_mean_reversion_R7_stage1_protocol_v1.json'
      - 'docs/governance/reversal_mean_reversion_R7_stage1_execution_freeze_v1.json'
      - '.github/workflows/rmr-r7-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-r7-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Run R7 synthetic and boundary tests
        run: python -m pytest -q tests/test_rmr_R7_stage1.py
      - name: Execute frozen R7 Stage1 screen
        run: |
          python scripts/run_rmr_R7_stage1.py \
            --parquet data/high_open_dev_2015_2025/1m_official.parquet \
            --output /tmp/rmr_R7_stage1_receipt.json \
            --usage-output /tmp/rmr_R7_stage1_data_usage.json
      - name: Verify sealed boundaries and no auto-promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/rmr_R7_stage1_receipt.json').read_text())
          u = json.loads(Path('/tmp/rmr_R7_stage1_data_usage.json').read_text())
          assert p['source']['max_day'] <= '2022-12-31'
          assert p['source']['rows_2023_or_later'] == 0
          assert p['reserve_2023_2025_opened'] is False
          assert p['2026_rows_loaded'] is False
          assert p['state_window_observed_bars'] == 240
          assert p['minimum_valid_within_session_returns'] == 120
          assert p['normalization_reference_window'] == 100
          assert p['score_id_exact'] == 'R7_directional_energy_balance'
          assert p['scales_exact'] == ['S1', 'S2']
          assert p['alternative_asymmetry_definition_search_performed'] is False
          assert p['z_threshold_search_performed'] is False
          assert p['trading_return_used'] is False
          assert p['third_mechanism_auto_promoted'] is False
          assert p['scientifically_fresh'] is False
          assert u['sealed_or_unopened']['CSI1000_2023-01-01_to_2025-12-31_internal_reserve'] is True
          assert u['sealed_or_unopened']['all_2026_rows'] is True
          print('R7 Stage1 frozen boundaries preserved')
          PY
      - name: Upload aggregate receipts only
        uses: actions/upload-artifact@v4
        with:
          name: rmr-r7-stage1-receipts
          path: |
            /tmp/rmr_R7_stage1_receipt.json
            /tmp/rmr_R7_stage1_data_usage.json
          if-no-files-found: error
