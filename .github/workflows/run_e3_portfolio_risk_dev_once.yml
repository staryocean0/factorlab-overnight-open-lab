name: One-shot E3 portfolio-risk development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_e3_portfolio_risk_dev_once.yml'

permissions:
  contents: write

jobs:
  run-e3-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow
      - name: Fetch frozen consumer snapshot inputs
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          echo "TMP=$TMP" >> "$GITHUB_ENV"
          BASE="https://raw.githubusercontent.com/staryocean0/factorlab-multifactor-stock-lab/af2e478aaff5c8ef7f753424b57fd2d19019f248/output/factor-rotation/reaka_current_k1_account_ledgers_v1_2011_2026/formal/account_snapshot"
          curl -fsSL "$BASE/holdings.parquet" -o "$TMP/holdings.parquet"
          curl -fsSL "$BASE/portfolio_daily.parquet" -o "$TMP/portfolio_daily.parquet"
          curl -fsSL "$BASE/snapshot_manifest.json" -o "$TMP/snapshot_manifest.json"
      - name: Verify frozen contracts and run E3 diagnostic
        run: |
          set -euo pipefail
          test ! -e docs/research/cloud_downstream_portfolio_risk_adapter_v1_dev_diagnostic.json
          python scripts/run_downstream_portfolio_risk_adapter_v1_dev_cloud.py \
            --consumer-holdings "$TMP/holdings.parquet" \
            --consumer-daily "$TMP/portfolio_daily.parquet" \
            --consumer-snapshot-manifest "$TMP/snapshot_manifest.json"
      - name: Commit E3 development receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/cloud_downstream_portfolio_risk_adapter_v1_dev_diagnostic.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/cloud_downstream_portfolio_risk_adapter_v1_dev_diagnostic.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/cloud_downstream_portfolio_risk_adapter_v1_dev_diagnostic.json
          git commit -m "Record E3 portfolio-risk development diagnostic [skip ci]"
          git push
