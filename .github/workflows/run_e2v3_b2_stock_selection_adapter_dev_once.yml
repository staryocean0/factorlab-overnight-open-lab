# technical retry: prior E2v3 computation completed with E2V3_DEV_NO_PROGRESS; receipt push lost a concurrent governance race; formula/gates unchanged
name: One-shot E2v3 B2 stock-selection adapter development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_e2v3_b2_stock_selection_adapter_dev_once.yml'

permissions:
  contents: write

jobs:
  run-e2v3-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run frozen E2v3 development diagnostic
        run: |
          set -euo pipefail
          test ! -e docs/research/cloud_downstream_b2_stock_selection_offshore_risk_adapter_v1_dev_diagnostic.json
          python scripts/run_downstream_b2_stock_selection_offshore_risk_adapter_v1_dev_cloud.py
      - name: Commit E2v3 development receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/cloud_downstream_b2_stock_selection_offshore_risk_adapter_v1_dev_diagnostic.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/cloud_downstream_b2_stock_selection_offshore_risk_adapter_v1_dev_diagnostic.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/cloud_downstream_b2_stock_selection_offshore_risk_adapter_v1_dev_diagnostic.json
          git commit -m "Record E2v3 B2 stock-selection adapter development diagnostic [skip ci]"
          git pull --rebase origin main
          git push
