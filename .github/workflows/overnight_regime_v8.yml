name: overnight-regime-v8

on:
  push:
    branches:
      - codex/overnight-regime-v8-20260906
    paths:
      - 'scripts/research_global_spillover_v8_regime.py'
      - 'tests/test_global_spillover_v8_regime.py'
      - 'docs/governance/global_spillover_v8_regime_data_usage_declaration.json'
      - 'docs/governance/overnight_explained_variance_v8_regime_preanalysis.md'
      - 'docs/governance/global_spillover_v8_regime_preregistration.json'
      - 'docs/governance/global_spillover_v8_forensic_diagnostic_plan.json'
      - '.github/workflows/overnight_regime_v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-regime-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scikit-learn pytest
      - name: Run full bounded regression suite
        run: pytest -q
      - name: Replay frozen baseline
        run: python scripts/replay_baseline.py
      - name: Replay frozen v6 parent
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_global_spillover_v6_daily_a50.py | tee v8_v6_parent_replay.log
      - name: Run preregistered v8 interaction exactly once
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_global_spillover_v8_regime.py | tee global_spillover_v8_regime.log
      - name: Upload formal v8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: overnight-regime-v8-final
          path: |
            docs/governance/global_spillover_v8_regime_data_usage_declaration.json
            docs/governance/overnight_explained_variance_v8_regime_preanalysis.md
            docs/governance/global_spillover_v8_regime_preregistration.json
            docs/governance/global_spillover_v8_forensic_diagnostic_plan.json
            artifacts/research/global_spillover_v8_regime_results.json
            v8_v6_parent_replay.log
            global_spillover_v8_regime.log
          if-no-files-found: error
          retention-days: 90
