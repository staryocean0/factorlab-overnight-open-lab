name: rmr-stage1-common-probe

on:
  push:
    branches:
      - codex/rmr-stage1-common-data-and-probes
    paths:
      - 'scripts/run_rmr_stage1_common_probe.py'
      - 'tests/test_rmr_stage1_common_probe.py'
      - 'docs/governance/reversal_mean_reversion_stage1_common_data_roles_v1.json'
      - 'docs/governance/reversal_mean_reversion_stage1_scale_contract_v1.json'
      - '.github/workflows/rmr-stage1-common-probe.yml'

permissions:
  contents: read

jobs:
  frozen-stage1-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen probe dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Run synthetic and boundary tests
        run: python -m pytest -q tests/test_rmr_stage1_common_probe.py
      - name: Execute frozen common Stage1 probe
        run: |
          python scripts/run_rmr_stage1_common_probe.py \
            --parquet data/high_open_dev_2015_2025/1m_official.parquet \
            --output /tmp/rmr_stage1_common_probe_receipt.json
      - name: Verify reserve and claim boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/rmr_stage1_common_probe_receipt.json').read_text())
          assert p['source_max_day'] <= '2022-12-31'
          assert p['reserve_2023_2025_opened'] is False
          assert p['scientifically_fresh'] is False
          assert set(p['R1']) == {'S1_inside_S2', 'S2_inside_S3'}
          assert set(p['R2']) == {'S1_outside_S2', 'S2_outside_S3'}
          assert set(p['R3']) == {'S2', 'S3'}
          print('RMR Stage1 reserve boundary preserved')
          PY
      - name: Upload aggregate receipt only
        uses: actions/upload-artifact@v4
        with:
          name: rmr-stage1-common-probe-receipt
          path: /tmp/rmr_stage1_common_probe_receipt.json
          if-no-files-found: error
