name: Print frozen extreme-open P4 runtime edges once
on:
  push:
    branches: ['research/overnight-extreme-p4-packaging']
    paths: ['.github/workflows/print-extreme-open-p4-edges-once.yml']
permissions:
  contents: write
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Print exact P0 tercile edges required by six P3 states
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/extreme_open_vnext_dev_sufficient_statistics_v1.json').read_text())
          keys=['B1_global_risk','B2_china_offshore','B4_driver_coherence','causal_prior_volatility_parent']
          print(json.dumps({k:x['quantile_edges'][k] for k in keys},indent=2,sort_keys=True))
          PY
      - name: Remove temporary edge-printer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/print-extreme-open-p4-edges-once.yml
          git commit -m 'chore: remove P4 edge printer [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
