name: Extreme-open P1/P2 cloud closeout one-shot
on:
  push:
    branches: ['research/overnight-extreme-p1p2-results']
    paths: ['.github/workflows/closeout-extreme-open-p1p2-once.yml']
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact QA dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Record closeout in canonical authority and QA contract
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.')
          identity='overnight_extreme_open_univariate_dev_v1'
          adjud='docs/research/extreme_open_univariate_dev_cloud_adjudication_20260914.md'
          receipt='docs/research/extreme_open_univariate_dev_v1_receipt.json'
          successor='overnight_extreme_open_preopen_survivor_intersections_dev_v1'
          survivors=[
            {'target':'EXTREME_UP','coordinate':'B1_global_risk','bucket':'HIGH'},
            {'target':'EXTREME_UP','coordinate':'B2_china_offshore','bucket':'HIGH'},
            {'target':'EXTREME_UP','coordinate':'causal_prior_volatility_parent','bucket':'HIGH'},
            {'target':'EXTREME_DOWN','coordinate':'B1_global_risk','bucket':'LOW'},
            {'target':'EXTREME_DOWN','coordinate':'B2_china_offshore','bucket':'LOW'},
            {'target':'EXTREME_DOWN','coordinate':'B4_driver_coherence','bucket':'LOW'},
          ]
          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text())
          a['active_research']=None
          p=a['planned_research']
          p['status']='P1_COMPLETE_6_SURVIVORS_P2_COMPLETE_NO_SURVIVOR_P3_FREEZE_REQUIRED'
          p['active_execution_authority']=False
          p['P1_complete']=True; p['P1_survivor_count']=6; p['P1_survivors']=survivors
          p['P2_complete']=True; p['P2_survivor_count']=0
          p['P2_postopen_intersection_authorized']=False
          p['P3_preopen_successor_freeze_permitted']=True
          p['P3_candidate_construction_rule']='all two-way intersections among same-target P1 survivors only; exactly 3 EXTREME_UP plus 3 EXTREME_DOWN candidates'
          p['P1_P2_receipt']=receipt; p['P1_P2_cloud_adjudication']=adjud
          p['next_gate']='freeze a separate P3 pre-open survivor-intersection identity before reading any intersection outcome; P2 rescue and 2021-2025 reusable BLACKBOX remain forbidden'
          a['recent_completed_research']['extreme_open_univariate_v1']={'identity':identity,'status':'P1_DEV_PROGRESS_6_PREOPEN_STATES__P2_DEV_NO_TRANSITION_SURVIVOR','decision':'P1_DEV_PROGRESS_6_PREOPEN_EXTREME_PROPENSITY_STATES__P2_DEV_NO_TRANSITION_SURVIVOR','receipt':receipt,'adjudication':adjud,'P1_survivor_count':6,'P2_survivor_count':0,'production_authority':False}
          a['closed_or_waiting']['Extreme_Open_P1_P2_v1']='P1_progression_6_preopen_states__P2_closed_no_univariate_transition_survivor__P3_requires_separate_freeze'
          a['hard_rules']=[r for r in a['hard_rules'] if not r.startswith('P0 is complete. Only overnight_extreme_open_univariate_dev_v1')]
          a['hard_rules'].append('Extreme-open P1/P2 v1 is closed: six P1 pre-open DEV survivor states are retained, P2 has zero transition survivors, and no P2 threshold/clock/bucket rescue or P2-derived P3 intersection is authorized.')
          a['hard_rules'].append('Any P3 continuation must be a separately frozen pre-open identity using only the mechanical six-candidate same-target two-way intersection family; 2021-2025 reusable BLACKBOX remains sealed.')
          a['next_action']='Freeze the separate pre-open P3 survivor-intersection identity and its incremental-concentration gate before materializing or reading any intersection outcomes.'
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')

          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text())
          r['active_research_identity']=None; r['active_research_status']=None
          r['next_research_identity']=successor
          r['next_research_note']='Result-free P3 freeze only: exactly six same-target two-way intersections from the six P1 survivors; no P2 rescue and no reusable BLACKBOX opening.'
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          lp=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(lp.read_text())
          current={x['path']:x for x in life['files']}
          blob=subprocess.check_output(['git','hash-object',adjud],text=True).strip()
          current[adjud]={'path':adjud,'lifecycle':'historical_immutable','frozen_blob':blob}
          life['files']=sorted(current.values(),key=lambda x:x['path']); lp.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')

          qp=root/'scripts/check_repository_consistency.py'; text=qp.read_text()
          old="""        elif plan_status == 'P0_COMPLETE_P1_P2_DEV_ADJUDICATION_AUTHORIZED':\n            active = a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_univariate_dev_v1':\n                errors.append('extreme-open P1/P2 authority identity drift')\n            if active.get('protocol') != 'docs/governance/extreme_open_univariate_dev_v1_protocol.json' or active.get('state') != 'docs/governance/extreme_open_univariate_dev_v1_state.json':\n                errors.append('extreme-open P1/P2 protocol/state binding drift')\n            if active.get('carrier_sha256') != 'd38483d9ef37e65506f858f6155482de32766a619c44ce799442d303c74cc321':\n                errors.append('extreme-open P0 carrier binding drift')\n            if active.get('P3_authorized') is not False or active.get('reusable_blackbox_2021_2025_open_authorized') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P1/P2 authority exceeds frozen DEV boundary')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          new="""        elif plan_status == 'P0_COMPLETE_P1_P2_DEV_ADJUDICATION_AUTHORIZED':\n            active = a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_univariate_dev_v1':\n                errors.append('extreme-open P1/P2 authority identity drift')\n            if active.get('protocol') != 'docs/governance/extreme_open_univariate_dev_v1_protocol.json' or active.get('state') != 'docs/governance/extreme_open_univariate_dev_v1_state.json':\n                errors.append('extreme-open P1/P2 protocol/state binding drift')\n            if active.get('carrier_sha256') != 'd38483d9ef37e65506f858f6155482de32766a619c44ce799442d303c74cc321':\n                errors.append('extreme-open P0 carrier binding drift')\n            if active.get('P3_authorized') is not False or active.get('reusable_blackbox_2021_2025_open_authorized') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P1/P2 authority exceeds frozen DEV boundary')\n        elif plan_status == 'P1_COMPLETE_6_SURVIVORS_P2_COMPLETE_NO_SURVIVOR_P3_FREEZE_REQUIRED':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open closed P1/P2 identity improperly remains active')\n            if planned.get('P1_survivor_count') != 6 or planned.get('P2_survivor_count') != 0:\n                errors.append('extreme-open P1/P2 closeout count drift')\n            if planned.get('P2_postopen_intersection_authorized') is not False or planned.get('P3_preopen_successor_freeze_permitted') is not True:\n                errors.append('extreme-open P3 closeout boundary drift')\n            if planned.get('P3_candidate_construction_rule') != 'all two-way intersections among same-target P1 survivors only; exactly 3 EXTREME_UP plus 3 EXTREME_DOWN candidates':\n                errors.append('extreme-open P3 candidate-construction drift')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          if old not in text: raise SystemExit('P1/P2 QA status block not found')
          text=text.replace(old,new)
          text=text.replace("f\"计划身份：`{planned.get('program_id')}`；状态：`{planned.get('status')}`。当前 `active_research` 仍为空，结果型执行权限为 `{planned.get('active_execution_authority')}`。\"", "f\"计划身份：`{planned.get('program_id')}`；状态：`{planned.get('status')}`。当前 `active_research`：{active_text}；结果型执行权限为 `{planned.get('active_execution_authority')}`。\"")
          qp.write_text(text)
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/closeout-extreme-open-p1p2-once.yml
      - name: Commit canonical closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: close extreme-open P1/P2 DEV and stage P3 freeze [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
