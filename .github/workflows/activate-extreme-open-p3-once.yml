name: Activate extreme-open P3 pre-open DEV authority one-shot
on:
  push:
    branches: ['research/overnight-extreme-p3-freeze']
    paths: ['.github/workflows/activate-extreme-open-p3-once.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Activate only frozen six-candidate P3 identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          identity='overnight_extreme_open_preopen_survivor_intersections_dev_v1'
          protocol='docs/governance/extreme_open_preopen_intersections_dev_v1_protocol.json'
          state='docs/governance/extreme_open_preopen_intersections_dev_v1_state.json'
          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text())
          a['active_research']={
            'identity':identity,
            'status':'AUTHORIZED_P3_PREOPEN_SIX_INTERSECTIONS_NOT_YET_EXECUTED',
            'protocol':protocol,
            'state':state,
            'allowed_phases':['P3_mechanical_intersection_carrier','P3_incremental_concentration_DEV_adjudication'],
            'candidate_count':6,
            'P2_postopen_intersections_authorized':False,
            'reusable_blackbox_2021_2025_open_authorized':False,
            'P4_authorized':False,
            'production_authority':False
          }
          p=a['planned_research']
          p['status']='P3_PREOPEN_INTERSECTIONS_AUTHORIZED_NOT_YET_EXECUTED'
          p['active_execution_authority']=True
          p['P3_identity']=identity; p['P3_protocol']=protocol; p['P3_state']=state
          p['P3_candidate_count']=6
          p['P3_outcomes_opened']=False
          p['next_gate']='materialize and adjudicate exactly the six frozen pre-open intersections; no P2 rescue, no P4, no reusable BLACKBOX'
          a['hard_rules'].append('Only the frozen six-candidate pre-open P3 intersection identity is active. P2 post-open intersections, three-way/mixed-target candidates, edge refits, threshold/clock search, P4, reusable BLACKBOX, account execution and production remain unauthorized.')
          a['next_action']='Materialize and adjudicate exactly six pre-open P3 survivor intersections under the frozen incremental-concentration protocol; retain all candidates and stop before P4.'
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')

          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text())
          r['active_research_identity']=identity
          r['active_research_status']='AUTHORIZED_P3_PREOPEN_SIX_INTERSECTIONS_NOT_YET_EXECUTED'
          r['next_research_identity']=None
          r['next_research_note']='Execute only the frozen six-candidate P3 pre-open intersection protocol; P2 rescue/P4/reusable BLACKBOX remain unauthorized.'
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          lp=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(lp.read_text())
          new={protocol:'maintained',state:'maintained'}
          life['files']=[x for x in life['files'] if x['path'] not in new]
          life['files'] += [{'path':k,'lifecycle':v} for k,v in new.items()]
          life['files'].sort(key=lambda x:x['path']); lp.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')

          qp=root/'scripts/check_repository_consistency.py'; text=qp.read_text()
          old="""        elif plan_status == 'P1_COMPLETE_6_SURVIVORS_P2_COMPLETE_NO_SURVIVOR_P3_FREEZE_REQUIRED':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open closed P1/P2 identity improperly remains active')\n            if planned.get('P1_survivor_count') != 6 or planned.get('P2_survivor_count') != 0:\n                errors.append('extreme-open P1/P2 closeout count drift')\n            if planned.get('P2_postopen_intersection_authorized') is not False or planned.get('P3_preopen_successor_freeze_permitted') is not True:\n                errors.append('extreme-open P3 closeout boundary drift')\n            if planned.get('P3_candidate_construction_rule') != 'all two-way intersections among same-target P1 survivors only; exactly 3 EXTREME_UP plus 3 EXTREME_DOWN candidates':\n                errors.append('extreme-open P3 candidate-construction drift')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          newcheck="""        elif plan_status == 'P1_COMPLETE_6_SURVIVORS_P2_COMPLETE_NO_SURVIVOR_P3_FREEZE_REQUIRED':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open closed P1/P2 identity improperly remains active')\n            if planned.get('P1_survivor_count') != 6 or planned.get('P2_survivor_count') != 0:\n                errors.append('extreme-open P1/P2 closeout count drift')\n            if planned.get('P2_postopen_intersection_authorized') is not False or planned.get('P3_preopen_successor_freeze_permitted') is not True:\n                errors.append('extreme-open P3 closeout boundary drift')\n            if planned.get('P3_candidate_construction_rule') != 'all two-way intersections among same-target P1 survivors only; exactly 3 EXTREME_UP plus 3 EXTREME_DOWN candidates':\n                errors.append('extreme-open P3 candidate-construction drift')\n        elif plan_status == 'P3_PREOPEN_INTERSECTIONS_AUTHORIZED_NOT_YET_EXECUTED':\n            active=a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_preopen_survivor_intersections_dev_v1':\n                errors.append('extreme-open P3 authority identity drift')\n            if active.get('protocol') != 'docs/governance/extreme_open_preopen_intersections_dev_v1_protocol.json' or active.get('state') != 'docs/governance/extreme_open_preopen_intersections_dev_v1_state.json':\n                errors.append('extreme-open P3 protocol/state binding drift')\n            if active.get('candidate_count') != 6 or planned.get('P3_candidate_count') != 6:\n                errors.append('extreme-open P3 candidate-count drift')\n            if active.get('P2_postopen_intersections_authorized') is not False or active.get('P4_authorized') is not False or active.get('reusable_blackbox_2021_2025_open_authorized') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P3 authority exceeds frozen boundary')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          if old not in text: raise SystemExit('P3 closeout QA block not found')
          qp.write_text(text.replace(old,newcheck))
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/activate-extreme-open-p3-once.yml
      - name: Commit result-free P3 activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: activate frozen extreme-open P3 pre-open DEV [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
