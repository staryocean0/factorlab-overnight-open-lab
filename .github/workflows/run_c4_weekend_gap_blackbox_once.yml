name: One-shot C4 weekend-gap reusable BLACKBOX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run_c4_weekend_gap_blackbox_once.yml']
permissions:
  contents: write
jobs:
  run-c4-blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Reconstruct panel and run compact C4 BLACKBOX
        run: |
          set -euo pipefail
          test ! -e docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
          python scripts/build_v6a_frozen_base_panel.py \
            --raw-panel data/high_open_dev_2015_2025/annotated_panel.parquet \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --nasdaq data/high_open_dev_2015_2025/fred_nasdaq.csv \
            --vix data/high_open_dev_2015_2025/fred_vix.csv \
            --frozen-panel data/development/csi1000_open_pit_panel.parquet \
            --panel-out "$TMP/panel.parquet" \
            --nasdaq-normalized-out "$TMP/nasdaq.csv" \
            --vix-normalized-out "$TMP/vix.csv"
          python scripts/run_calendar_weekend_gap_15m_blackbox.py \
            --panel "$TMP/panel.parquet" \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --source-manifest data/high_open_dev_2015_2025/manifest.json \
            --reconstruction-contract docs/governance/v6a_base_panel_reconstruction_contract_20260910.json \
            --runtime-text-root data/runtime_text_2015_2025 \
            --protocol docs/governance/calendar_weekend_gap_15m_blackbox_protocol_v1.json \
            --receipt-out docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json
      - name: Commit compact C4 receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json$' || true)"; test -z "$EXTRA"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json
          git commit -m "Record C4 weekend-gap reusable BLACKBOX receipt [skip ci]"
          git push
