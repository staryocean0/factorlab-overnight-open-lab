name: gap-fill-v2-true-fresh-prereg-check

on:
  push:
    paths:
      - '.github/workflows/gap-fill-v2-true-fresh-prereg-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scipy scikit-learn pytest
      - name: Verify preregistered blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/research/gap_fill_v2_true_fresh_preanalysis_20260906.md)" = "c1831c3849b6ff4826be7c335b683bc2ea9844b1"
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_v2_true_fresh_protocol_v1.json)" = "d2bae1e0ac285748dbe7af1a584a08feb2aefdde"
          test "$(git hash-object scripts/evaluate_gap_fill_v2_true_fresh_2026q4.py)" = "d418c8281d9f417798c574affdc0ed34b8e46920"
          test "$(git hash-object tests/test_gap_fill_v2_true_fresh_protocol.py)" = "c7c7946d79526b9b40ed17ca210225e46c141d8e"
          test "$(git hash-object scripts/evaluate_local_gap_fill_v2_2026_repeat.py)" = "d61e00efa6e605864c8153a1e7e577257f813939"
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_v2_final_fit_freeze_v1.json)" = "eef7a9af6d42ee2faf53dbd16dce0b15ebfd10ed"
      - name: Validate theme package
        run: python3 scripts/validate_theme_package.py
      - name: Run full regression tests only
        run: python3 -m pytest -q
      - name: Assert fresh evaluator was not executed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/research/gap_fill_v2_true_fresh_2026q4_receipt_v1.json
          test ! -e docs/governance/gap_fill_v2_true_fresh_2026q4_data_usage_v1.json
          echo 'Fresh outcomes remain unopened.'
