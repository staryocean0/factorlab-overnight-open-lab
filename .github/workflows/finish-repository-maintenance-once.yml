name: Final repository maintenance acceptance (one shot)
on:
  push:
    branches: [maintenance/repository-consistency-20260912]
    paths: ['.github/workflows/finish-repository-maintenance-once.yml']
permissions:
  contents: write
concurrency:
  group: repository-maintenance-20260912
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Add schema-specific compatibility without mutating frozen receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_repository_consistency.py')
          text = p.read_text()
          anchor = 'def ledger_errors(ledger: dict, authority: dict, registry: dict) -> list[str]:'
          helper = '\n'.join([
              'def receipt_identity(receipt: dict) -> str | None:',
              '    """Only the exact original V6A schema uses candidate as its identity field."""',
              "    if receipt.get('schema_id') == 'overnight_v6a_reusable_blackbox_receipt@1.0':",
              "        return receipt.get('candidate')",
              "    return receipt.get('research_identity')",
              '', '',
          ])
          assert anchor in text and 'def receipt_identity(' not in text
          text = text.replace(anchor, helper + anchor, 1)
          old = "                if receipt.get(key) != q.get(key):"
          new = "                actual = receipt_identity(receipt) if key == 'research_identity' else receipt.get(key)\n                if actual != q.get(key):"
          assert text.count(old) == 1
          text = text.replace(old,new,1)
          old = "    by_id = {q['query_id']: q for q in ledger['queries']}"
          new = '\n'.join([
              old,
              "    if (a.get('active_research') or {}).get('identity') != registry.get('active_research_identity'):",
              "        errors.append('authority/registry active identity mismatch')",
              "    registry_products = {p['product_id']: p for p in registry['products']}",
              "    for component in catalog['validated_components']:",
              "        cid = component['component_id']",
              "        if cid != 'V6A':",
              "            product = registry_products.get(cid, {})",
              "            if product.get('research_identity') != component['research_identity'] or product.get('blackbox_query_id') != component['query_id'] or not product.get('status', '').startswith('validated_BLACKBOX_PASS'):",
              "                errors.append('registry/component identity or status mismatch: ' + cid)",
              "        for test_path in component['tests']:",
              "            if test_path not in declared or not (root/test_path).is_file():",
              "                errors.append('missing component regression binding: ' + test_path)",
          ])
          assert text.count(old) == 1
          p.write_text(text.replace(old,new,1))
          tests = Path('tests/test_repository_consistency.py')
          tests.write_text(tests.read_text()+'\n\n'+ '\n'.join([
              'def test_exact_v6a_legacy_schema_uses_candidate_identity():',
              "    r = {'schema_id':'overnight_v6a_reusable_blackbox_receipt@1.0','candidate':'frozen_v6a'}",
              "    assert qa.receipt_identity(r) == 'frozen_v6a'",
              '',
              'def test_modern_receipt_requires_research_identity():',
              "    assert qa.receipt_identity({'schema_id':'modern@1.0','candidate':'wrong'}) is None",
              '',
              'def test_modern_identity_does_not_fall_back_to_candidate():',
              "    assert qa.receipt_identity({'schema_id':'modern@1.0','candidate':'wrong','research_identity':'correct'}) == 'correct'",
              '',
          ]))
          Path('.github/workflows/finish-repository-maintenance-once.yml').unlink()
          PY
          git add -A
      - name: Publish repair to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind legacy receipt schema and registry checks without changing evidence [skip ci]'
          git push origin HEAD:maintenance/repository-consistency-20260912
      - name: Install exact QA dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Consistency acceptance
        id: consistency
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/check_repository_consistency.py | tee "$RUNNER_TEMP/consistency.json"
      - name: Synthetic and metadata tests
        id: regression
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/tests.xml"
      - name: Persist truthful QA receipt
        if: always()
        env:
          QA_CONSISTENCY: ${{ steps.consistency.outcome }}
          QA_REGRESSION: ${{ steps.regression.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          target = Path('docs/maintenance/20260912_verification.json')
          prior = json.loads(target.read_text())
          temp = Path(os.environ['RUNNER_TEMP'])
          result = {'status':'PASS' if os.environ['QA_CONSISTENCY']=='success' and os.environ['QA_REGRESSION']=='success' else 'FAIL','checked_source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'python':sys.version.split()[0],'consistency_step':os.environ['QA_CONSISTENCY'],'regression_step':os.environ['QA_REGRESSION'],'production_authority':False,'new_scientific_query_created':False,'market_or_account_rows_opened':False,'prior_verification':prior}
          if (temp/'consistency.json').exists():
              result['consistency'] = json.loads((temp/'consistency.json').read_text())
          if (temp/'tests.xml').exists():
              cases=list(ET.parse(temp/'tests.xml').getroot().iter('testcase'))
              result['test_cases']=len(cases)
              result['failures']=[{'test':c.get('classname','')+'::'+c.get('name',''),'reason':n.get('message','')[:1000]} for c in cases for n in list(c) if n.tag in {'failure','error'}]
          target.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git add docs/maintenance/20260912_verification.json
          git commit -m 'Record final metadata and synthetic acceptance receipt [skip ci]'
          git push origin HEAD:maintenance/repository-consistency-20260912
      - name: Require PASS
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('docs/maintenance/20260912_verification.json').read_text())['status']=='PASS'
          PY
