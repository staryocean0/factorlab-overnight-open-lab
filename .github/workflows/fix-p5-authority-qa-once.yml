name: Fix P5 query-authority QA semantics once
on:
  push:
    branches: ['research/overnight-extreme-p5-authorize']
    paths: ['.github/workflows/fix-p5-authority-qa-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Make legacy reusable-window guard distinguish query authority from detail release
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/check_repository_consistency.py')
          text=p.read_text()
          old="""        if planned.get('reusable_blackbox_2021_2025_open_authorized') is not False:\n            errors.append('extreme-open plan improperly opens reusable BLACKBOX detail')\n"""
          new="""        p5_query_authorized = planned.get('status') == 'P5_REUSABLE_VALIDATION_AUTHORIZED_NOT_YET_QUERIED'\n        if p5_query_authorized:\n            if planned.get('reusable_blackbox_2021_2025_open_authorized') is not True:\n                errors.append('extreme-open P5 reusable query authority missing')\n        elif planned.get('reusable_blackbox_2021_2025_open_authorized') is not False:\n            errors.append('extreme-open plan improperly opens reusable BLACKBOX detail')\n"""
          if old not in text:
              raise SystemExit('legacy reusable detail guard not found')
          p.write_text(text.replace(old,new,1))
          PY
          git rm .github/workflows/fix-p5-authority-qa-once.yml
      - name: Commit QA semantic correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: distinguish P5 query authority from detail release [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
