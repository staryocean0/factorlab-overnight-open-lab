name: R2 range-integrity v2

on:
  push:
    branches:
      - codex/r2-range-integrity-20260908
    paths:
      - '.github/workflows/r2-range-integrity-v2.yml'
      - 'scripts/run_rmr_R2_range_integrity_v2.py'
      - 'scripts/certify_rmr_R2_range_integrity_v2_blackbox.py'
      - 'tests/test_rmr_R2_range_integrity_v2.py'
      - 'tests/test_reusable_three_role_blackbox.py'
      - 'docs/governance/reversal_mean_reversion_R2_range_integrity_v2_protocol.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn pytest
      - name: Test frozen R2 family
        run: python -m pytest -q tests/test_rmr_R2_range_integrity_v2.py tests/test_reusable_three_role_blackbox.py
      - name: Run detailed R2 DEV VALIDATION
        run: |
          python scripts/run_rmr_R2_range_integrity_v2.py \
            --receipt /tmp/r2_validation.json \
            --freeze /tmp/r2_freeze.json
      - name: Run low-bandwidth R2 BLACKBOX certification
        shell: bash
        run: |
          set +e
          python scripts/certify_rmr_R2_range_integrity_v2_blackbox.py \
            --freeze /tmp/r2_freeze.json \
            --receipt /tmp/r2_blackbox.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            echo "R2 BLACKBOX infrastructure failure"
            exit "$code"
          fi
      - name: Enforce BLACKBOX low bandwidth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/r2_blackbox.json').read_text())
          allowed={
            'schema_id','research_identity','query_id','candidate_fingerprint',
            'protocol_fingerprint','blackbox_source_fingerprint','blackbox_window',
            'decision','details_released','exact_metrics_released','counts_released',
            'subperiods_released','event_rows_released','blackbox_remains_closed',
            'repeated_query_is_independent_OOS','production_authority'
          }
          assert set(p)==allowed
          assert p['decision'] in {'PASS','FAIL','INSUFFICIENT'}
          assert p['details_released'] is False
          assert p['exact_metrics_released'] is False
          assert p['counts_released'] is False
          assert p['subperiods_released'] is False
          assert p['event_rows_released'] is False
          print(p['decision'])
          PY
      - name: Upload bounded outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-range-integrity-v2
          path: |
            /tmp/r2_validation.json
            /tmp/r2_freeze.json
            /tmp/r2_blackbox.json
          if-no-files-found: warn
