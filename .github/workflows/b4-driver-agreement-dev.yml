name: b4-driver-agreement-dev

on:
  push:
    paths:
      - '.github/workflows/b4-driver-agreement-dev.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --quiet pandas numpy
      - name: Run frozen B4 2015-2020 diagnostic
        run: |
          python scripts/diagnose_driver_agreement_disagreement_dev.py \
            --factor-runtime-root data/runtime_text_2015_2025 \
            --driver-runtime-root data/driver_runtime_text_2015_2020 \
            --protocol docs/governance/driver_agreement_disagreement_v1_protocol.json \
            --carrier-receipt docs/research/driver_runtime_text_carrier_parity_receipt_v1.json \
            --receipt-out docs/research/cloud_driver_agreement_disagreement_dev_diagnostic_v1.json
      - name: Verify evidence boundary
        run: |
          grep -q '"target_rows_after_2020_loaded": false' docs/research/cloud_driver_agreement_disagreement_dev_diagnostic_v1.json
          grep -q '"reusable_blackbox_2021_2025_opened": false' docs/research/cloud_driver_agreement_disagreement_dev_diagnostic_v1.json
          grep -q '"driver_weight_search": false' docs/research/cloud_driver_agreement_disagreement_dev_diagnostic_v1.json
          grep -q '"alternate_target_search": false' docs/research/cloud_driver_agreement_disagreement_dev_diagnostic_v1.json
      - name: Commit B4 development receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/cloud_driver_agreement_disagreement_dev_diagnostic_v1.json
          git commit -m 'Record B4 driver-agreement development diagnostic [skip ci]'
          git push
