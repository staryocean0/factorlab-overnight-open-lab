name: overnight-domestic-night-shfe-migrated-audit

on:
  push:
    branches:
      - codex/overnight-domestic-night-source-20260906
    paths:
      - 'scripts/audit_domestic_night_source_crosscheck.py'
      - 'scripts/audit_domestic_night_shfe_migrated_crosscheck.py'
      - 'tests/test_domestic_night_source_crosscheck.py'
      - 'docs/governance/domestic_night_source_crosscheck_sample_freeze.json'
      - 'docs/governance/domestic_night_source_official_endpoint_contract.json'
      - 'docs/governance/domestic_night_official_endpoint_migration_correction.json'
      - '.github/workflows/overnight_domestic_night_shfe_migrated_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-domestic-night-shfe-migrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --upgrade pandas numpy requests lxml pytest
      - name: Recheck frozen trading-day semantics
        run: pytest -q tests/test_domestic_night_source_crosscheck.py
      - name: Crosscheck frozen CU/RB samples against migrated official SHFE daily path
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_domestic_night_shfe_migrated_crosscheck.py | tee shfe_migrated_crosscheck.log
      - name: Upload SHFE source-audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: overnight-domestic-night-shfe-migrated-audit
          path: |
            docs/governance/domestic_night_source_crosscheck_sample_freeze.json
            docs/governance/domestic_night_source_official_endpoint_contract.json
            docs/governance/domestic_night_official_endpoint_migration_correction.json
            artifacts/research/domestic_night_shfe_migrated_crosscheck_results.json
            shfe_migrated_crosscheck.log
          if-no-files-found: error
          retention-days: 90
