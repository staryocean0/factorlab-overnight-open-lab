name: gap-fill-v2-phase2-hazard-selection

on:
  push:
    paths:
      - '.github/workflows/gap-fill-v2-phase2-hazard-selection.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scipy scikit-learn pytest
      - name: Verify frozen code and governance identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_v2_phase2_hazard_family_v1.json)" = "a3a077fc3f41058e366cb753918ff19143f5c460"
          test "$(git hash-object scripts/select_gap_fill_v2_phase2_hazard_family.py)" = "df4afc944ac4d0f7c37864dba6787de1c887e778"
          test "$(git hash-object tests/test_gap_fill_v2_phase2_hazard_family.py)" = "a863c9d30da674e0fb83b6e3ae1968670edfefb4"
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_prediction_v2_protocol_v1.json)" = "b0f31e6479d1897a577eea90aaa12d78a7f78e7a"
          test "$(git hash-object docs/research/gap_fill_v2_phase1_factor_adjudication_20260906.md)" = "3e04dcf7bc093a56eed489314c78d4705f2663f8"
          test "$(git hash-object docs/governance/cloud_session_20260906_direction_head_selected_v1.json)" = "c52189502f84f8ae813615a322eecadd6927fc08"
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_v2_phase2_execution_freeze_v1.json)" = "09c38be5fd3fb0b8c0712641ce823824f14536a6"
      - name: Verify frozen data identities
        shell: bash
        run: |
          set -euo pipefail
          echo 'f2587a528a517052016b646b58c734569b64a87766ff096575f353587e46aed1  data/high_open_dev_2015_2025/annotated_panel.parquet' | sha256sum -c -
          echo '11f4a5e78381371680fbcf6e01891216f645a8de869646ced6a623970727bcce  data/high_open_dev_2015_2025/1m_official.parquet' | sha256sum -c -
          echo '800f3b0d9bce8a243ee9932fe350878eb22f8dafa2885e2c0d5d7fd88e3748c9  data/high_open_dev_2015_2025/fred_nasdaq.csv' | sha256sum -c -
          echo '4cd9341dca20cea785c9f4e2417e4227bd98ddc59469e2924e43f3610fc131ef  data/high_open_dev_2015_2025/fred_vix.csv' | sha256sum -c -
      - name: Validate package
        run: python3 scripts/validate_theme_package.py
      - name: Run regression tests
        run: python3 -m pytest -q
      - name: Run frozen Phase-2 hazard selection
        run: python3 scripts/select_gap_fill_v2_phase2_hazard_family.py
      - name: Verify selection evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/research/cloud_session_20260906_gap_fill_v2_phase2_hazard_selection_receipt_v1.json')
          u = Path('docs/governance/cloud_session_20260906_gap_fill_v2_phase2_hazard_data_usage_v1.json')
          assert p.exists() and u.exists()
          d = json.loads(p.read_text())
          assert d['gap_fill_model_fitting_performed'] is True
          assert d['candidate_selection_performed'] is True
          assert d['hyperparameter_search_performed'] is False
          assert d['threshold_search_performed'] is False
          assert d['model_class_search_performed'] is False
          assert d['probability_calibration_used_for_selection'] is False
          assert d['2026_rows_loaded'] is False
          assert d['2026_repeat_validation_opened'] is False
          assert d['hazard_oof_years'] == list(range(2017, 2026))
          for sign in ['high', 'low']:
              s = d['sign_results'][sign]
              assert s['common_oof_days_identical'] is True
              for name in ['benchmark', 'geometry', 'full']:
                  obj = s[name]
                  if name == 'benchmark':
                      eval_obj = obj['evaluation']
                  else:
                      eval_obj = obj['evaluation']
                  for cohort in ['all', 'gt10bp', 'gt30bp']:
                      assert eval_obj[cohort]['horizons']['fill_15m']['n'] > 0
                  for model_name in ['geometry', 'full']:
                      pass
          print(json.dumps({
              'selected_head_count': d['selected_head_count'],
              'selected_heads': {k: None if v is None else v['selected_feature_set'] for k, v in d['selected_heads'].items()},
              'selected_architecture_sha256': d['selected_architecture_sha256'],
              'decision': d['decision'],
              '2026_rows_loaded': d['2026_rows_loaded'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit aggregate Phase-2 receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gap-fill-v2-phase2-cloud-runner'
          git config user.email 'gap-fill-v2-phase2-cloud-runner@users.noreply.github.com'
          git add \
            docs/research/cloud_session_20260906_gap_fill_v2_phase2_hazard_selection_receipt_v1.json \
            docs/governance/cloud_session_20260906_gap_fill_v2_phase2_hazard_data_usage_v1.json
          if git diff --cached --quiet; then
            echo 'No Phase-2 receipt changes.'
          else
            git commit -m 'Record cloud gap-fill V2 Phase-2 hazard selection [skip ci]'
            git push origin HEAD:main
          fi
