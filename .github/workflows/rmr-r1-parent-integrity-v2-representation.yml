name: rmr-r1-parent-integrity-v2-representation

on:
  push:
    branches:
      - codex/rmr-round1-closeout-r1-specialist-freeze
    paths:
      - 'scripts/run_rmr_R1_parent_integrity_v2_representation.py'
      - 'tests/test_rmr_R1_parent_integrity_v2_representation.py'
      - 'docs/research/rmr_R1_parent_integrity_v2_representation_preanalysis_20260908.md'
      - 'docs/governance/rmr_R1_parent_integrity_v2_representation_protocol_v1.json'
      - 'docs/governance/rmr_R1_parent_integrity_v2_representation_execution_freeze_v1.json'
      - '.github/workflows/rmr-r1-parent-integrity-v2-representation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-representation-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Run R1 specialist synthetic and boundary tests
        run: python -m pytest -q tests/test_rmr_R1_parent_integrity_v2_representation.py
      - name: Execute frozen representation selection
        run: |
          python scripts/run_rmr_R1_parent_integrity_v2_representation.py \
            --parquet data/high_open_dev_2015_2025/1m_official.parquet \
            --output /tmp/r1_representation_receipt.json \
            --bundle-output /tmp/r1_selected_bundle.json \
            --usage-output /tmp/r1_representation_usage.json
      - name: Verify holdout boundary and complexity-first semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/r1_representation_receipt.json').read_text())
          u = json.loads(Path('/tmp/r1_representation_usage.json').read_text())
          assert p['source']['max_day'] <= '2022-12-31'
          assert p['source']['rows_2023_or_later'] == 0
          assert p['holdout_2023_2025_opened'] is False
          assert p['2026_rows_loaded'] is False
          assert p['candidate_order'] == ['composite_integrity_plus_severity','original_three_parent_plus_severity']
          assert p['composite_weight_fit_performed'] is False
          assert p['parent_feature_search_performed'] is False
          assert p['wave_scale_search_performed'] is False
          assert p['trading_return_used'] is False
          assert u['sealed_or_unopened']['CSI1000_2023-01-01_to_2025-12-31_mechanism_holdout'] is True
          assert u['sealed_or_unopened']['all_2026_rows'] is True
          attempted = p['candidate_attempts']
          if attempted and attempted[0]['eligible']:
              assert len(attempted) == 1
              assert p['original_three_evaluated'] is False
          if p['selected_candidate_id'] is not None:
              b = json.loads(Path('/tmp/r1_selected_bundle.json').read_text())
              assert b['selected_candidate_id'] == p['selected_candidate_id']
              assert b['holdout_2023_2025_opened'] is False
              assert b['bundle_digest_sha256'] == p['selected_bundle_digest_sha256']
          print('R1 specialist representation boundaries preserved')
          PY
      - name: Upload aggregate receipts and selected bundle only
        uses: actions/upload-artifact@v4
        with:
          name: rmr-r1-parent-integrity-v2-representation-receipts
          path: |
            /tmp/r1_representation_receipt.json
            /tmp/r1_representation_usage.json
            /tmp/r1_selected_bundle.json
          if-no-files-found: warn
