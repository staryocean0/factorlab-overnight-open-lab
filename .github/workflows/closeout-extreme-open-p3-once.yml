name: Extreme-open P3 cloud closeout one-shot
on:
  push:
    branches: ['research/overnight-extreme-p3-results']
    paths: ['.github/workflows/closeout-extreme-open-p3-once.yml']
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact QA dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Record P3 closeout in canonical authority
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.')
          identity='overnight_extreme_open_preopen_survivor_intersections_dev_v1'
          receipt='docs/research/extreme_open_p3_intersections_dev_v1_receipt.json'
          adjud='docs/research/extreme_open_p3_intersections_dev_cloud_adjudication_20260914.md'
          carrier='data/extreme_open_p3_intersection_sufficient_statistics_v1.json'
          carrier_sha='0c97062e9b4d96570098ba97d1465de384387f6d6dab7a052e89483ad4a30c77'
          survivors=[
            'UP_B1_HIGH_X_B2_HIGH','UP_B1_HIGH_X_VOL_HIGH','UP_B2_HIGH_X_VOL_HIGH',
            'DOWN_B1_LOW_X_B2_LOW','DOWN_B1_LOW_X_B4_LOW','DOWN_B2_LOW_X_B4_LOW'
          ]
          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text())
          a['active_research']=None
          p=a['planned_research']
          p['status']='P3_COMPLETE_6_OF_6_INCREMENTAL_PREOPEN_STATES_P4_FREEZE_REQUIRED'
          p['active_execution_authority']=False
          p['P3_complete']=True; p['P3_survivor_count']=6; p['P3_survivors']=survivors
          p['P3_carrier']=carrier; p['P3_carrier_sha256']=carrier_sha
          p['P3_receipt']=receipt; p['P3_cloud_adjudication']=adjud
          p['P3_set_valued_overlap_semantics_required']=True
          p['P3_three_way_probability_authority']=False
          p['P4_packaging_freeze_permitted']=True
          p['P4_authorized']=False
          p['next_gate']='freeze a result-free P4 set-valued callable-state packaging contract; do not choose a best P3 state, calibrate overlaps, open P5 reusable validation, or integrate consumers yet'
          a['recent_completed_research']['extreme_open_p3_intersections_v1']={
            'identity':identity,'status':'P3_DEV_PROGRESS_ALL_6_INCREMENTAL_PREOPEN_INTERSECTION_STATES',
            'decision':'P3_DEV_PROGRESS_ALL_6_INCREMENTAL_PREOPEN_INTERSECTION_STATES',
            'receipt':receipt,'adjudication':adjud,'carrier':carrier,'carrier_sha256':carrier_sha,
            'survivor_count':6,'production_authority':False}
          a['closed_or_waiting']['Extreme_Open_P3_v1']='completed_DEV_6_of_6_incremental_preopen_intersection_states__P4_packaging_freeze_required'
          a['hard_rules']=[r for r in a['hard_rules'] if not r.startswith('Only the frozen six-candidate pre-open P3 intersection identity is active.')]
          a['hard_rules'].append('Extreme-open P3 is closed with six DEV progression states. They are set-valued and non-mutually-exclusive; no winner selection, three-way probability synthesis, pair-probability averaging/multiplication, or fired-state-count calibration is authorized.')
          a['hard_rules'].append('P4 may package the exact six P3 states plus supporting P1 lineage with default ABSTAIN and no post-open instruction; P5 reusable validation, consumer integration, account execution and production remain unauthorized until separately frozen.')
          a['next_action']='Freeze the P4 callable-state interface: exact six P3 state IDs, runtime inputs, set-valued overlap semantics, supporting P1 lineage, ABSTAIN behavior and explicit absence of P2 post-open authority.'
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')

          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text())
          r['active_research_identity']=None; r['active_research_status']=None
          r['next_research_identity']='overnight_extreme_open_callable_state_packaging_v1'
          r['next_research_note']='Result-free P4 packaging only: preserve all six P3 states as a set-valued interface; no winner/overlap calibration/P5 validation yet.'
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          lp=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(lp.read_text()); current={x['path']:x for x in life['files']}
          blob=subprocess.check_output(['git','hash-object',adjud],text=True).strip(); current[adjud]={'path':adjud,'lifecycle':'historical_immutable','frozen_blob':blob}
          state='docs/governance/extreme_open_preopen_intersections_dev_v1_state.json'; current[state]={'path':state,'lifecycle':'maintained'}
          life['files']=sorted(current.values(),key=lambda x:x['path']); lp.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')

          qp=root/'scripts/check_repository_consistency.py'; text=qp.read_text()
          old="""        elif plan_status == 'P3_PREOPEN_INTERSECTIONS_AUTHORIZED_NOT_YET_EXECUTED':\n            active=a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_preopen_survivor_intersections_dev_v1':\n                errors.append('extreme-open P3 authority identity drift')\n            if active.get('protocol') != 'docs/governance/extreme_open_preopen_intersections_dev_v1_protocol.json' or active.get('state') != 'docs/governance/extreme_open_preopen_intersections_dev_v1_state.json':\n                errors.append('extreme-open P3 protocol/state binding drift')\n            if active.get('candidate_count') != 6 or planned.get('P3_candidate_count') != 6:\n                errors.append('extreme-open P3 candidate-count drift')\n            if active.get('P2_postopen_intersections_authorized') is not False or active.get('P4_authorized') is not False or active.get('reusable_blackbox_2021_2025_open_authorized') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P3 authority exceeds frozen boundary')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          new="""        elif plan_status == 'P3_PREOPEN_INTERSECTIONS_AUTHORIZED_NOT_YET_EXECUTED':\n            active=a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_preopen_survivor_intersections_dev_v1':\n                errors.append('extreme-open P3 authority identity drift')\n            if active.get('protocol') != 'docs/governance/extreme_open_preopen_intersections_dev_v1_protocol.json' or active.get('state') != 'docs/governance/extreme_open_preopen_intersections_dev_v1_state.json':\n                errors.append('extreme-open P3 protocol/state binding drift')\n            if active.get('candidate_count') != 6 or planned.get('P3_candidate_count') != 6:\n                errors.append('extreme-open P3 candidate-count drift')\n            if active.get('P2_postopen_intersections_authorized') is not False or active.get('P4_authorized') is not False or active.get('reusable_blackbox_2021_2025_open_authorized') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P3 authority exceeds frozen boundary')\n        elif plan_status == 'P3_COMPLETE_6_OF_6_INCREMENTAL_PREOPEN_STATES_P4_FREEZE_REQUIRED':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open closed P3 identity improperly remains active')\n            if planned.get('P3_complete') is not True or planned.get('P3_survivor_count') != 6:\n                errors.append('extreme-open P3 closeout count drift')\n            if planned.get('P3_carrier_sha256') != '0c97062e9b4d96570098ba97d1465de384387f6d6dab7a052e89483ad4a30c77':\n                errors.append('extreme-open P3 carrier closeout drift')\n            if planned.get('P3_set_valued_overlap_semantics_required') is not True or planned.get('P3_three_way_probability_authority') is not False:\n                errors.append('extreme-open P3 overlap interpretation drift')\n            if planned.get('P4_packaging_freeze_permitted') is not True or planned.get('P4_authorized') is not False:\n                errors.append('extreme-open P4 pre-freeze boundary drift')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          if old not in text: raise SystemExit('P3 QA block not found')
          qp.write_text(text.replace(old,new))
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/closeout-extreme-open-p3-once.yml
      - name: Commit canonical P3 closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: close extreme-open P3 and stage P4 packaging freeze [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
