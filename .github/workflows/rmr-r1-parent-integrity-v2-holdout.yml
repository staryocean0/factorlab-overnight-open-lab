name: rmr-r1-parent-integrity-v2-holdout

on:
  push:
    branches:
      - codex/rmr-r1-specialist-v2-20260908
    paths:
      - 'scripts/evaluate_rmr_R1_parent_integrity_v2_holdout.py'
      - 'tests/test_rmr_R1_parent_integrity_v2_holdout.py'
      - 'docs/governance/reversal_mean_reversion_R1_parent_integrity_v2_holdout_protocol_v1.json'
      - 'docs/governance/reversal_mean_reversion_R1_parent_integrity_v2_holdout_execution_freeze_v1.json'
      - 'docs/governance/cloud_session_20260908_rmr_R1_parent_integrity_v2_parameter_freeze_v1.json'
      - '.github/workflows/rmr-r1-parent-integrity-v2-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-r1-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Run R1 holdout tests
        run: python -m pytest -q tests/test_rmr_R1_parent_integrity_v2_holdout.py
      - name: Execute frozen R1 mechanism holdout
        run: |
          python scripts/evaluate_rmr_R1_parent_integrity_v2_holdout.py \
            --parquet data/high_open_dev_2015_2025/1m_official.parquet \
            --output /tmp/r1v2_holdout_receipt.json
      - name: Verify frozen boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/r1v2_holdout_receipt.json').read_text())
          assert r['source']['max_day'] <= '2025-12-31'
          assert r['2026_rows_loaded'] is False
          assert r['selected_candidate_id'] == 'R1_PARENT_COMPOSITE_1D'
          assert r['parameter_bundle_sha256'] == 'e618a5a06a803f4464267e69e39f98fa316fd572f40efcb3f9e40fc25df2779c'
          assert r['refit_performed'] is False
          assert r['parameter_mutation_performed'] is False
          assert r['candidate_change_performed'] is False
          assert r['scale_or_threshold_search_performed'] is False
          assert r['trading_return_used'] is False
          assert r['scientifically_fresh'] is False
          print('R1 v2 holdout boundaries preserved')
          PY
      - name: Upload aggregate holdout receipt only
        uses: actions/upload-artifact@v4
        with:
          name: rmr-r1-parent-integrity-v2-holdout
          path: /tmp/r1v2_holdout_receipt.json
          if-no-files-found: error
