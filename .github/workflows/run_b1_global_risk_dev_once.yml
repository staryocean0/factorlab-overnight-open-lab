name: One-shot B1 global-risk development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_b1_global_risk_dev_once.yml'

permissions:
  contents: write

jobs:
  run-b1-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run frozen B1 diagnostic
        run: |
          set -euo pipefail
          test ! -e docs/research/cloud_global_risk_driver_v1_dev_diagnostic.json
          python scripts/run_global_risk_driver_v1_dev_cloud.py
      - name: Commit B1 development receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/cloud_global_risk_driver_v1_dev_diagnostic.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/cloud_global_risk_driver_v1_dev_diagnostic.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/cloud_global_risk_driver_v1_dev_diagnostic.json
          git commit -m "Record B1 global-risk development diagnostic [skip ci]"
          git push
