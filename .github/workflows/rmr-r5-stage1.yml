name: rmr-r5-stage1

on:
  push:
    branches:
      - codex/rmr-r5-stage1-execution-20260908
    paths:
      - 'scripts/run_rmr_R5_stage1.py'
      - 'tests/test_rmr_R5_stage1.py'
      - 'docs/governance/reversal_mean_reversion_R5_stage1_protocol_v1.json'
      - 'docs/governance/reversal_mean_reversion_R5_stage1_execution_freeze_v1.json'
      - '.github/workflows/rmr-r5-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-r5-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Run R5 synthetic and boundary tests
        run: python -m pytest -q tests/test_rmr_R5_stage1.py
      - name: Execute frozen R5 Stage1 screen
        run: |
          python scripts/run_rmr_R5_stage1.py \
            --parquet data/high_open_dev_2015_2025/1m_official.parquet \
            --output /tmp/rmr_R5_stage1_receipt.json \
            --usage-output /tmp/rmr_R5_stage1_data_usage.json
      - name: Verify sealed boundaries and exact candidate budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/rmr_R5_stage1_receipt.json').read_text())
          u = json.loads(Path('/tmp/rmr_R5_stage1_data_usage.json').read_text())
          assert p['source']['max_day'] <= '2022-12-31'
          assert p['source']['rows_2023_or_later'] == 0
          assert p['reserve_2023_2025_opened'] is False
          assert p['2026_rows_loaded'] is False
          assert p['properties_exact'] == [
              'R5_A_path_efficiency',
              'R5_B_volatility_state_displacement',
              'R5_C_event_density',
          ]
          assert p['scales_exact'] == ['S1', 'S2']
          assert p['reference_window'] == 100
          assert p['scale_search_performed'] is False
          assert p['z_threshold_search_performed'] is False
          assert p['interaction_or_ensemble_search_performed'] is False
          assert p['trading_return_used'] is False
          assert p['scientifically_fresh'] is False
          assert u['sealed_or_unopened']['CSI1000_2023-01-01_to_2025-12-31_internal_reserve'] is True
          assert u['sealed_or_unopened']['all_2026_rows'] is True
          print('R5 Stage1 boundaries preserved')
          PY
      - name: Upload aggregate receipts only
        uses: actions/upload-artifact@v4
        with:
          name: rmr-r5-stage1-receipts
          path: |
            /tmp/rmr_R5_stage1_receipt.json
            /tmp/rmr_R5_stage1_data_usage.json
          if-no-files-found: error
