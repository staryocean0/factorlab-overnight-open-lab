# Temporary one-shot packaging finalizer; self-deletes on success.
name: Finalize extreme-open P4 callable-state packaging once
on:
  push:
    branches: ['research/overnight-extreme-p4-packaging']
    paths: ['.github/workflows/finalize-extreme-open-p4-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact QA dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run P4 interface regression before freeze
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_extreme_open_callable_state.py
      - name: Register exact P4 package and P5 boundary
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('.')
          identity='overnight_extreme_open_callable_state_packaging_v1'
          protocol='docs/governance/extreme_open_callable_state_packaging_v1_protocol.json'
          state='docs/governance/extreme_open_callable_state_packaging_v1_state.json'
          impl='scripts/extreme_open_callable_state.py'
          test='tests/test_extreme_open_callable_state.py'

          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text())
          a['active_research']=None
          p=a['planned_research']
          p.update({
            'status':'P4_CALLABLE_STATE_PACKAGING_FROZEN_P5_FREEZE_REQUIRED',
            'active_execution_authority':False,
            'P4_complete':True,
            'P4_identity':identity,
            'P4_protocol':protocol,
            'P4_state':state,
            'P4_reference_implementation':impl,
            'P4_callable_state_count':6,
            'P4_set_valued_interface':True,
            'P4_target_conflict_action':'ABSTAIN_TARGET_CONFLICT',
            'P4_no_state_action':'ABSTAIN_NO_P3_STATE',
            'P4_postopen_transition_action':'ABSTAIN_NO_VALIDATED_P2_STATE',
            'P4_combined_probability_authority':False,
            'P4_three_way_state_authority':False,
            'P5_reusable_validation_freeze_permitted':True,
            'P5_reusable_validation_open_authorized':False,
            'next_gate':'freeze a low-bandwidth reusable 2021-2025 P5 validation for the exact six-state P4 interface before opening any reusable-window result'
          })
          a['recent_completed_research']['extreme_open_callable_packaging_v1']={
            'identity':identity,'status':'DEV_packaged_waiting_reusable_validation',
            'protocol':protocol,'state':state,'reference_implementation':impl,
            'callable_state_count':6,'validated_reusable_product_authority':False,
            'production_authority':False}
          a['closed_or_waiting']['Extreme_Open_P4_v1']='packaging_frozen_exact_six_state_set_waiting_separately_frozen_P5_reusable_validation'
          for rule in [
            'P4 freezes the exact six-state set-valued interface. No winner selection, combined probability, three-way state, mixed-target tie-break, post-open transition instruction, position/instrument/order mapping, or consumer integration is authorized.',
            'P5 may validate only the exact frozen P4 interface on the reusable 2021-2025 window under a separately preregistered low-bandwidth contract; any P4 mutation requires a new identity.'
          ]:
              if rule not in a['hard_rules']: a['hard_rules'].append(rule)
          a['next_action']='Freeze the exact P5 reusable validation protocol for the six P4 state IDs and abstention/conflict semantics before opening any 2021-2025 validation output.'
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')

          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text())
          products=[x for x in r['products'] if x.get('product_id')!='OFP-A5']
          a5={'product_id':'OFP-A5','name':'extreme_open_callable_state','status':'DEV_packaged_waiting_reusable_validation','availability':'pre_open_coordinate_interface','research_identity':identity,'protocol':protocol,'state':state,'reference_implementation':impl,'scientific_parent':'overnight_extreme_open_preopen_survivor_intersections_dev_v1','callable_state_count':6,'consumer_roles':['timing_filter','risk','confidence','future_consumer_adapter'],'set_valued_interface':True,'default_abstain':True,'postopen_transition_authority':False,'validated_product_authority':False,'reusable_validation_authorized':False,'production_authority':False}
          insert=next((i+1 for i,x in enumerate(products) if x.get('product_id')=='OFP-A4'),len(products))
          products.insert(insert,a5); r['products']=products
          r['active_research_identity']=None; r['active_research_status']=None
          r['next_research_identity']='overnight_extreme_open_callable_state_reusable_validation_v1'
          r['next_research_note']='Freeze P5 validation before opening reusable 2021-2025 results; exact P4 six-state interface only.'
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          lp=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(lp.read_text()); cur={x['path']:x for x in life['files']}
          cur[protocol]={'path':protocol,'lifecycle':'maintained'}
          cur[state]={'path':state,'lifecycle':'maintained'}
          for path,lifecycle in [(impl,'frozen_implementation'),(test,'current_contract_regression')]:
              blob=subprocess.check_output(['git','hash-object',path],text=True).strip()
              cur[path]={'path':path,'lifecycle':lifecycle,'frozen_blob':blob}
          life['files']=sorted(cur.values(),key=lambda x:x['path'])
          lp.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/finalize-extreme-open-p4-once.yml
      - name: Commit exact P4 package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'p4: freeze extreme-open callable state package [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
