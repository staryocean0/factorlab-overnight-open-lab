name: One-shot B2 China-offshore development
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run_b2_china_offshore_dev_once.yml']
permissions:
  contents: write
jobs:
  run-b2-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run frozen B2 diagnostic
        run: |
          set -euo pipefail
          test ! -e docs/research/cloud_china_offshore_driver_v1_dev_diagnostic.json
          python scripts/run_single_external_driver_dev_cloud.py --protocol "$GITHUB_WORKSPACE/docs/governance/china_offshore_driver_v1_protocol.json"
      - name: Commit B2 development receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/cloud_china_offshore_driver_v1_dev_diagnostic.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/cloud_china_offshore_driver_v1_dev_diagnostic.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/cloud_china_offshore_driver_v1_dev_diagnostic.json
          git commit -m "Record B2 China-offshore development diagnostic [skip ci]"
          git push
