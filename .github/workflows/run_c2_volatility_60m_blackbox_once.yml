name: One-shot C2 60m reusable BLACKBOX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_c2_volatility_60m_blackbox_once.yml'

permissions:
  contents: write

jobs:
  run-c2-blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Reconstruct frozen panel and run compact C2 BLACKBOX
        run: |
          set -euo pipefail
          test ! -e docs/research/local_volatility_conditioned_open_state_60m_blackbox_receipt_v1.json
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          python scripts/build_v6a_frozen_base_panel.py \
            --raw-panel data/high_open_dev_2015_2025/annotated_panel.parquet \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --nasdaq data/high_open_dev_2015_2025/fred_nasdaq.csv \
            --vix data/high_open_dev_2015_2025/fred_vix.csv \
            --frozen-panel data/development/csi1000_open_pit_panel.parquet \
            --panel-out "$TMP/panel_2015_2025.parquet" \
            --nasdaq-normalized-out "$TMP/fred_nasdaq.csv" \
            --vix-normalized-out "$TMP/fred_vix.csv"
          python scripts/run_volatility_conditioned_open_state_60m_blackbox_local.py \
            --panel "$TMP/panel_2015_2025.parquet" \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --raw-panel data/high_open_dev_2015_2025/annotated_panel.parquet \
            --nasdaq data/high_open_dev_2015_2025/fred_nasdaq.csv \
            --vix data/high_open_dev_2015_2025/fred_vix.csv \
            --frozen-panel data/development/csi1000_open_pit_panel.parquet \
            --source-manifest data/high_open_dev_2015_2025/manifest.json \
            --base-manifest data/manifest.json \
            --reconstruction-contract docs/governance/v6a_base_panel_reconstruction_contract_20260910.json \
            --protocol docs/governance/volatility_conditioned_open_state_60m_blackbox_protocol_v1.json \
            --receipt-out docs/research/local_volatility_conditioned_open_state_60m_blackbox_receipt_v1.json
      - name: Commit compact C2 receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/local_volatility_conditioned_open_state_60m_blackbox_receipt_v1.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/local_volatility_conditioned_open_state_60m_blackbox_receipt_v1.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/local_volatility_conditioned_open_state_60m_blackbox_receipt_v1.json
          git commit -m "Record C2 60m reusable BLACKBOX receipt [skip ci]"
          git push
