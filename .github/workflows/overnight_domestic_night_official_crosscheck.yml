name: overnight-domestic-night-official-crosscheck

on:
  push:
    branches:
      - codex/overnight-domestic-night-20260905
    paths:
      - 'scripts/crosscheck_domestic_night_official_daily.py'
      - 'docs/governance/domestic_night_official_daily_crosscheck_preregistration.json'
      - '.github/workflows/overnight_domestic_night_official_crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-domestic-night-official-crosscheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-validation dependencies
        run: python -m pip install --upgrade pandas numpy requests
      - name: Crosscheck fixed vendor sample against official SHFE and DCE daily data
        shell: bash
        run: |
          set -o pipefail
          python scripts/crosscheck_domestic_night_official_daily.py | tee domestic_night_official_daily_crosscheck.log
      - name: Upload official crosscheck evidence
        uses: actions/upload-artifact@v4
        with:
          name: overnight-domestic-night-official-crosscheck
          path: |
            docs/governance/domestic_night_official_daily_crosscheck_preregistration.json
            artifacts/research/domestic_night_official_daily_crosscheck.json
            domestic_night_official_daily_crosscheck.log
          if-no-files-found: error
          retention-days: 90
