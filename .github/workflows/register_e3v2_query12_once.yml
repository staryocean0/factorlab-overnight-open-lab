name: One-shot register E3v2 reusable query 12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register_e3v2_query12_once.yml'

permissions:
  contents: write

jobs:
  register-query-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Register exactly one E3v2 logical query
        run: python scripts/register_e3v2_validation_query12.py
      - name: Commit ledger only
        run: |
          set -euo pipefail
          git status --short
          EXTRA="$(git status --short | grep -v '^ M docs/governance/overnight_reusable_blackbox_query_ledger_v1.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/overnight_reusable_blackbox_query_ledger_v1.json
          git commit -m "Register E3v2 reusable BLACKBOX query 12 [skip ci]"
          git push
