name: Activate extreme-open P1/P2 DEV authority one-shot
on:
  push:
    branches: ['research/overnight-extreme-p1p2-dev']
    paths: ['.github/workflows/activate-extreme-open-p1p2-once.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Advance canonical authority without reading outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          aid='overnight_extreme_open_univariate_dev_v1'
          protocol='docs/governance/extreme_open_univariate_dev_v1_protocol.json'
          state='docs/governance/extreme_open_univariate_dev_v1_state.json'
          carrier='data/extreme_open_vnext_dev_sufficient_statistics_v1.json'
          carrier_sha='d38483d9ef37e65506f858f6155482de32766a619c44ce799442d303c74cc321'
          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text())
          a['active_research']={'identity':aid,'status':'AUTHORIZED_P1_P2_DEV_ADJUDICATION_NOT_YET_EXECUTED','protocol':protocol,'state':state,'carrier':carrier,'carrier_sha256':carrier_sha,'allowed_phases':['P1_preopen_univariate','P2_postopen_univariate'],'reusable_blackbox_2021_2025_open_authorized':False,'P3_authorized':False,'production_authority':False}
          p=a['planned_research']; p['status']='P0_COMPLETE_P1_P2_DEV_ADJUDICATION_AUTHORIZED'; p['active_execution_authority']=True; p['P0_carrier']=carrier; p['P0_carrier_sha256']=carrier_sha; p['P0_complete']=True; p['adjudication_contract']=protocol; p['next_gate']='execute the exact frozen P1/P2 univariate DEV adjudication; do not open P3 or 2021-2025 reusable BLACKBOX'
          a['hard_rules']=[r for r in a['hard_rules'] if not r.startswith('The vNext extreme-open program is documentation-frozen only')]
          a['hard_rules'].append('P0 is complete. Only overnight_extreme_open_univariate_dev_v1 P1/P2 DEV adjudication is active; no threshold/clock/candidate-family mutation, P3 intersection search, 2021-2025 reusable BLACKBOX opening, or production promotion is authorized.')
          a['next_action']='Execute the frozen P1/P2 DEV adjudication against the immutable P0 sufficient-statistics carrier under extreme_open_univariate_dev_v1_protocol.json; retain all hypotheses and stop before P3 until cloud adjudication is recorded.'
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')
          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text()); r['active_research_identity']=aid; r['active_research_status']='AUTHORIZED_P1_P2_DEV_ADJUDICATION_NOT_YET_EXECUTED'; r['next_research_identity']=None; r['next_research_note']='Execute only the frozen P1/P2 univariate DEV protocol; P3 and reusable BLACKBOX remain unauthorized.'; rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          lp=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(lp.read_text()); new={protocol:'maintained',state:'maintained'}; life['files']=[x for x in life['files'] if x['path'] not in new]; life['files'] += [{'path':k,'lifecycle':v} for k,v in new.items()]; life['files'].sort(key=lambda x:x['path']); lp.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')
          qp=root/'scripts/check_repository_consistency.py'; text=qp.read_text()
          old="""        if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n            errors.append('extreme-open docs-first plan improperly grants outcome execution')\n"""
          newcheck="""        plan_status = planned.get('status')\n        if plan_status == 'route_frozen_docs_first_p0_infrastructure_required_before_outcome_execution':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open docs-first plan improperly grants outcome execution')\n        elif plan_status == 'P0_COMPLETE_P1_P2_DEV_ADJUDICATION_AUTHORIZED':\n            active = a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_univariate_dev_v1':\n                errors.append('extreme-open P1/P2 authority identity drift')\n            if active.get('protocol') != 'docs/governance/extreme_open_univariate_dev_v1_protocol.json' or active.get('state') != 'docs/governance/extreme_open_univariate_dev_v1_state.json':\n                errors.append('extreme-open P1/P2 protocol/state binding drift')\n            if active.get('carrier_sha256') != 'd38483d9ef37e65506f858f6155482de32766a619c44ce799442d303c74cc321':\n                errors.append('extreme-open P0 carrier binding drift')\n            if active.get('P3_authorized') is not False or active.get('reusable_blackbox_2021_2025_open_authorized') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P1/P2 authority exceeds frozen DEV boundary')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n"""
          if old not in text: raise SystemExit('expected docs-first guard not found')
          qp.write_text(text.replace(old,newcheck))
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/activate-extreme-open-p1p2-once.yml
      - name: Commit activated authority to this branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: activate frozen extreme-open P1/P2 DEV authority [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
