name: Register B1 reusable BLACKBOX query 8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register_b1_blackbox_query8_once.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify compact receipt and append ledger entry
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          ledger_path = root/'docs/governance/overnight_reusable_blackbox_query_ledger_v1.json'
          receipt_path = root/'docs/research/local_global_risk_open_gap_blackbox_receipt_v1.json'
          ledger = json.loads(ledger_path.read_text())
          receipt = json.loads(receipt_path.read_text())
          assert ledger['query_count'] == 7
          assert len(ledger['queries']) == 7
          assert receipt['query_id'] == '6b0b6899f94fd8353a34'
          assert receipt['research_identity'] == 'overnight_global_risk_open_gap_v1'
          assert receipt['decision'] == 'PASS'
          assert receipt['public_detail_release'] is False
          assert receipt['internal_metrics_persisted'] is False
          assert receipt['yearly_results_persisted'] is False
          assert receipt['counts_persisted'] is False
          assert receipt['bootstrap_results_persisted'] is False
          assert receipt['failure_attribution_persisted'] is False
          entry = {
            'ordinal': 8,
            'query_id': receipt['query_id'],
            'research_identity': receipt['research_identity'],
            'comparator': receipt['comparator'],
            'decision': receipt['decision'],
            'receipt': 'docs/research/local_global_risk_open_gap_blackbox_receipt_v1.json',
            'receipt_commit': 'efabcbf3f9f3de4b597c0cad29c45ccdbe2ed754',
            'protocol_sha256': receipt['protocol_sha256'],
            'source_manifest_sha256': receipt['source_manifest_sha256'],
            'reconstruction_contract_sha256': receipt['reconstruction_contract_sha256'],
            'public_detail_release': False,
            'internal_metrics_persisted': False,
            'yearly_results_persisted': False,
            'counts_persisted': False,
            'bootstrap_results_persisted': False,
            'failure_attribution_persisted': False,
            'technical_retry_counted_as_separate_query': False,
            'blackbox_reusable_after_query': True,
            'blackbox_consumed_as_one_time_data': False,
            'reuse_is_independent_oos': False,
            'production_authority': False,
          }
          ledger['schema_id'] = 'overnight_reusable_blackbox_query_ledger@1.5'
          ledger['query_count'] = 8
          ledger['queries'].append(entry)
          ledger_path.write_text(json.dumps(ledger, indent=2) + '\n')
          PY
          git diff -- docs/governance/overnight_reusable_blackbox_query_ledger_v1.json
      - name: Commit ledger only
        run: |
          set -euo pipefail
          EXTRA="$(git status --short | grep -v '^ M docs/governance/overnight_reusable_blackbox_query_ledger_v1.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/overnight_reusable_blackbox_query_ledger_v1.json
          git commit -m "Register B1 reusable BLACKBOX query 8 PASS [skip ci]"
          git push
