name: Finalize extreme-open P5 reusable validation freeze once
on:
  push:
    branches: ['research/overnight-extreme-p5-freeze']
    paths: ['.github/workflows/finalize-extreme-open-p5-freeze-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact QA dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify P5 controller contract without opening BLACKBOX
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_extreme_open_callable_state_reusable_validation.py
      - name: Freeze P5 query contract without query authority
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('.')
          identity='overnight_extreme_open_callable_state_reusable_validation_v1'
          protocol='docs/governance/extreme_open_callable_state_reusable_validation_v1_protocol.json'
          state='docs/governance/extreme_open_callable_state_reusable_validation_v1_state.json'
          runner='scripts/run_extreme_open_callable_state_reusable_validation.py'
          test='tests/test_extreme_open_callable_state_reusable_validation.py'

          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text())
          a['active_research']=None
          p=a['planned_research']
          p.update({
            'status':'P5_REUSABLE_VALIDATION_FROZEN_QUERY_NOT_YET_AUTHORIZED',
            'active_execution_authority':False,
            'P5_identity':identity,
            'P5_protocol':protocol,
            'P5_state':state,
            'P5_runner':runner,
            'P5_exact_state_count':6,
            'P5_blackbox_window':'2021-01-01_to_2025-12-31',
            'P5_public_output':'PASS_FAIL_INSUFFICIENT_only',
            'P5_reusable_validation_freeze_permitted':True,
            'P5_reusable_validation_open_authorized':False,
            'next_gate':'after this freeze is merged, separately authorize exactly one reusable BLACKBOX query for the frozen P5 identity; no protocol mutation after authorization'
          })
          a['hard_rules'].append('P5 protocol is frozen but the reusable 2021-2025 query is not yet authorized. No BLACKBOX row or outcome may be opened until a separate authority transition binds the exact frozen protocol/runner/P4 implementation.')
          a['next_action']='After P5 freeze QA/merge, separately authorize one exact low-bandwidth reusable query for overnight_extreme_open_callable_state_reusable_validation_v1; do not mutate gates or P4 state definitions.'
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')

          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text())
          for product in r['products']:
              if product.get('product_id')=='OFP-A5':
                  product['status']='P5_reusable_validation_frozen_not_queried'
                  product['reusable_validation_identity']=identity
                  product['reusable_validation_protocol']=protocol
                  product['reusable_validation_state']=state
                  product['reusable_validation_runner']=runner
                  product['reusable_validation_authorized']=False
                  product['validated_product_authority']=False
                  product['production_authority']=False
          r['active_research_identity']=None; r['active_research_status']=None
          r['next_research_identity']=identity
          r['next_research_note']='P5 protocol frozen; query not authorized until separate authority transition after freeze merge.'
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          lp=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(lp.read_text()); cur={x['path']:x for x in life['files']}
          cur[protocol]={'path':protocol,'lifecycle':'maintained'}
          cur[state]={'path':state,'lifecycle':'maintained'}
          for path,lifecycle in [(runner,'frozen_implementation'),(test,'current_contract_regression')]:
              blob=subprocess.check_output(['git','hash-object',path],text=True).strip()
              cur[path]={'path':path,'lifecycle':lifecycle,'frozen_blob':blob}
          life['files']=sorted(cur.values(),key=lambda x:x['path'])
          lp.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')

          qp=root/'scripts/check_repository_consistency.py'; text=qp.read_text()
          if 'P5_REUSABLE_VALIDATION_FROZEN_QUERY_NOT_YET_AUTHORIZED' not in text:
              marker="""        else:\n            errors.append('unexpected extreme-open planned research status')\n        if planned.get('phase_order') != expected_phases:\n"""
              insert="""        elif plan_status == 'P5_REUSABLE_VALIDATION_FROZEN_QUERY_NOT_YET_AUTHORIZED':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open frozen P5 improperly grants query execution')\n            if planned.get('P5_identity') != 'overnight_extreme_open_callable_state_reusable_validation_v1' or planned.get('P5_exact_state_count') != 6:\n                errors.append('extreme-open P5 identity/state-count drift')\n            if planned.get('P5_public_output') != 'PASS_FAIL_INSUFFICIENT_only' or planned.get('P5_blackbox_window') != '2021-01-01_to_2025-12-31':\n                errors.append('extreme-open P5 output/window drift')\n            if planned.get('P5_reusable_validation_open_authorized') is not False or planned.get('reusable_blackbox_2021_2025_open_authorized') is not False:\n                errors.append('extreme-open P5 freeze improperly opens reusable BLACKBOX')\n            if planned.get('P4_combined_probability_authority') is not False or planned.get('P4_three_way_state_authority') is not False:\n                errors.append('extreme-open P5 freeze mutates P4 overlap boundary')\n        else:\n            errors.append('unexpected extreme-open planned research status')\n        if planned.get('phase_order') != expected_phases:\n"""
              if marker not in text: raise SystemExit('planned research status marker not found')
              qp.write_text(text.replace(marker,insert,1))
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/finalize-extreme-open-p5-freeze-once.yml
      - name: Commit result-free P5 freeze
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'p5: freeze extreme-open reusable validation contract [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
