name: Register C4 reusable BLACKBOX query 11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/register_c4_blackbox_query11_once.yml']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Append verified C4 ledger entry
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          lp=pathlib.Path('docs/governance/overnight_reusable_blackbox_query_ledger_v1.json')
          rp=pathlib.Path('docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json')
          l=json.loads(lp.read_text()); r=json.loads(rp.read_text())
          assert l['query_count']==10 and len(l['queries'])==10
          assert r['query_id']=='85335f9aaae24c263cf6' and r['decision']=='FAIL'
          assert all(r[k] is False for k in ['public_detail_release','internal_metrics_persisted','yearly_results_persisted','counts_persisted','bootstrap_results_persisted','failure_attribution_persisted'])
          l['schema_id']='overnight_reusable_blackbox_query_ledger@1.8'; l['query_count']=11
          l['queries'].append({
            'ordinal':11,'query_id':r['query_id'],'research_identity':r['research_identity'],'comparator':r['comparator'],'decision':r['decision'],
            'receipt':'docs/research/local_calendar_weekend_gap_15m_blackbox_receipt_v1.json','receipt_commit':'b9633c9dcc4eac3e6c43795b340b702c4da52b19',
            'protocol_sha256':r['protocol_sha256'],'source_manifest_sha256':r['source_manifest_sha256'],'reconstruction_contract_sha256':r['reconstruction_contract_sha256'],'reconstructed_panel_2015_2020_parity':r['reconstructed_panel_2015_2020_parity'],'target_clock_2019_2020_parity':r['target_clock_2019_2020_parity'],
            'public_detail_release':False,'internal_metrics_persisted':False,'yearly_results_persisted':False,'counts_persisted':False,'bootstrap_results_persisted':False,'failure_attribution_persisted':False,'technical_retry_counted_as_separate_query':False,'blackbox_reusable_after_query':True,'blackbox_consumed_as_one_time_data':False,'reuse_is_independent_oos':False,'production_authority':False})
          lp.write_text(json.dumps(l,indent=2)+'\n')
          PY
      - name: Commit ledger only
        run: |
          set -euo pipefail
          EXTRA="$(git status --short | grep -v '^ M docs/governance/overnight_reusable_blackbox_query_ledger_v1.json$' || true)"; test -z "$EXTRA"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/overnight_reusable_blackbox_query_ledger_v1.json
          git commit -m "Register C4 reusable BLACKBOX query 11 FAIL [skip ci]"
          git push
