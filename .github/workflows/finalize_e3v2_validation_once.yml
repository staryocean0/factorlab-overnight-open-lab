name: One-shot sync authority after E3v2 closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize_e3v2_validation_once.yml'

permissions:
  contents: write

jobs:
  sync-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile authority and registry
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          LEDGER = Path('docs/governance/overnight_reusable_blackbox_query_ledger_v1.json')
          STATE = Path('docs/governance/downstream_b1_forward_cycle_portfolio_risk_adapter_validation_v1_state.json')
          AUTH = Path('docs/governance/current_authority_v1.json')
          REG = Path('docs/governance/overnight_factor_product_registry_v1.json')

          def load(p):
              return json.loads(p.read_text(encoding='utf-8'))

          def dump(p, x):
              p.write_text(json.dumps(x, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ledger = load(LEDGER)
          state = load(STATE)
          q12 = next((q for q in ledger.get('queries', []) if int(q.get('ordinal', -1)) == 12), None)
          assert ledger.get('query_count') == 12
          assert q12 is not None
          assert q12.get('query_id') == 'ce859f9c94f281b0ec49'
          assert q12.get('decision') == 'FAIL'
          assert q12.get('research_identity') == 'overnight_b1_forward_cycle_portfolio_risk_abstention_validation_v1'
          assert state.get('blackbox_query_id') == q12['query_id']
          assert state.get('blackbox_result') == 'FAIL'
          assert state.get('validated_product_authority') is False
          assert state.get('production_authority') is False

          auth = load(AUTH)
          assert auth.get('schema_id') == 'overnight_open_current_authority@1.30'
          assert auth.get('active_research', {}).get('identity') == q12['research_identity']
          auth['schema_id'] = 'overnight_open_current_authority@1.31'
          auth['active_research'] = None
          rd = auth.setdefault('recent_downstream_research', {})
          if 'E3v2_parent' in rd:
              rd['E3v2_parent']['status'] = 'DEV_progression_closed_by_reusable_BLACKBOX_FAIL'
          rd['E3v2_validation'] = {
              'identity': q12['research_identity'],
              'status': 'BLACKBOX_FAIL_closed_no_validated_E3v2_product',
              'decision': 'FAIL',
              'blackbox_query_id': q12['query_id'],
              'blackbox_ledger_ordinal': 12,
              'validated_product_authority': False,
              'account_execution_authority': False,
              'production_authority': False
          }
          auth.setdefault('recent_completed_research', {})['E3_v2'] = {
              'identity': q12['research_identity'],
              'status': 'BLACKBOX_FAIL_closed_no_validated_E3v2_product',
              'blackbox_query_id': q12['query_id'],
              'blackbox_ledger_ordinal': 12
          }
          auth.setdefault('closed_or_waiting', {})['E3_v2_B1_forward_cycle_portfolio_risk_adapter'] = 'completed_FAIL_query_12_no_validated_product'
          auth['blackbox_ledger_query_count'] = 12
          hard = [x for x in auth.get('hard_rules', []) if not x.startswith('E3v2 validation must ') and not x.startswith('A PASS for E3v2 ')]
          additions = [
              'E3v2 reusable query 12 is FAIL; no hidden-behavior diagnosis, threshold search, magnitude bucket search, clock selection, B1 reweighting, target change, consumer mutation, or automatic rescue is authorized.',
              'E3v2 BLACKBOX FAIL is an adapter-contract result only and does not revoke validated upstream B1 authority.'
          ]
          for x in additions:
              if x not in hard:
                  hard.append(x)
          auth['hard_rules'] = hard
          auth['next_action'] = 'No additional outcome-bearing research is automatically authorized. Maintain the validated shelf and wait for a separately motivated result-free identity or the already-frozen Gap-Fill V2 true-fresh date gate. Cloud main remains research authority and should request the user only for a concrete missing-data dependency.'
          auth['production_authority'] = False
          dump(AUTH, auth)

          reg = load(REG)
          assert reg.get('schema_id') == 'overnight_factor_product_registry@1.12'
          reg['schema_id'] = 'overnight_factor_product_registry@1.13'
          products = {p['product_id']: p for p in reg.get('products', [])}

          products['OFP-B1'].update({
              'status': 'validated_BLACKBOX_PASS_continuous_factor_product',
              'research_identity': 'overnight_global_risk_open_gap_v1',
              'blackbox_query_id': '6b0b6899f94fd8353a34',
              'blackbox_ledger_ordinal': 8,
              'validated_product_authority': True
          })
          products['OFP-B2'].update({
              'status': 'validated_BLACKBOX_PASS_continuous_factor_product',
              'research_identity': 'overnight_china_offshore_open_gap_v1',
              'blackbox_query_id': '608e037b0d24724b097b',
              'blackbox_ledger_ordinal': 9,
              'validated_product_authority': True
          })
          products['OFP-B3'].update({
              'status': 'closed_after_BLACKBOX_FAIL_no_validated_B3_product',
              'research_identity': 'overnight_fx_cny_open_gap_v1',
              'blackbox_query_id': '34699d9d9b3ca36d1a6d',
              'blackbox_ledger_ordinal': 10,
              'validated_product_authority': False,
              'rescue_search_authorized': False
          })
          products['OFP-C2'].update({
              'status': 'validated_BLACKBOX_PASS_60m_continuous_factor_product',
              'blackbox_query_id': 'a1068de9321c04632aad',
              'blackbox_ledger_ordinal': 7,
              'blackbox_query_opened': True,
              'validated_product_authority': True,
              'validated_interaction': 'observed_gap_rvol * log(rvol20)',
              'validated_target': '09:35_to_10:35_return'
          })
          products['OFP-C4'].update({
              'status': 'closed_after_BLACKBOX_FAIL_no_validated_C4_product',
              'research_identity': 'overnight_weekend_gap_conditioned_open_state_15m_blackbox_v1',
              'blackbox_query_id': '85335f9aaae24c263cf6',
              'blackbox_ledger_ordinal': 11,
              'validated_product_authority': False,
              'rescue_search_authorized': False,
              'consumer_roles': ['historical_negative_evidence']
          })
          products['OFP-E1'].update({
              'status': 'latest_v2_DEV_NO_PROGRESS_closed_no_successor',
              'latest_identity': 'overnight_c1_c2_timing_agreement_adapter_v1',
              'latest_decision': 'E1V2_DEV_NO_PROGRESS',
              'latest_state': 'docs/governance/downstream_c1_c2_timing_agreement_adapter_v1_state.json',
              'latest_adjudication': 'docs/research/downstream_c1_c2_timing_agreement_adapter_v1_dev_cloud_adjudication_20260912.md',
              'prior_identity': 'overnight_c1_b4_timing_confidence_adapter_validation_v1',
              'prior_status': 'BLACKBOX_FAIL_closed_no_validated_E1_product',
              'successor_authorized': False
          })
          products['OFP-E2'].update({
              'status': 'latest_v2_DEV_INSUFFICIENT_closed_no_successor',
              'latest_identity': 'overnight_c2_stock_selection_risk_abstention_adapter_v1',
              'latest_decision': 'E2V2_DEV_INSUFFICIENT',
              'latest_state': 'docs/governance/downstream_c2_stock_selection_risk_adapter_v1_state.json',
              'latest_adjudication': 'docs/research/downstream_c2_stock_selection_risk_adapter_v1_dev_cloud_adjudication_20260912.md',
              'consumer_repository': 'staryocean0/factorlab-multifactor-stock-lab',
              'consumer_strategy_id': 'REAKA_D5_H20_R5_CURRENT_GENERATION_V1',
              'prior_identity': 'overnight_b4_stock_selection_abstention_adapter_v1',
              'prior_status': 'DEV_NO_PROGRESS_closed_no_successor',
              'successor_authorized': False
          })
          products['OFP-E3'].update({
              'status': 'latest_v2_BLACKBOX_FAIL_closed_no_validated_E3v2_product',
              'latest_identity': q12['research_identity'],
              'latest_parent_development_identity': 'overnight_b1_forward_cycle_portfolio_risk_abstention_v1',
              'latest_decision': 'FAIL',
              'latest_state': str(STATE),
              'latest_adjudication': 'docs/research/downstream_b1_forward_cycle_portfolio_risk_adapter_validation_v1_blackbox_cloud_adjudication_20260912.md',
              'blackbox_query_id': q12['query_id'],
              'blackbox_ledger_ordinal': 12,
              'validated_product_authority': False,
              'successor_authorized': False,
              'account_execution_authority': False,
              'production_authority': False
          })
          reg['active_research_identity'] = None
          reg['active_research_status'] = None
          reg['deferred_frozen_identity'] = None
          reg['waiting_validation_identity'] = None
          reg['next_research_identity'] = None
          reg['next_research_note'] = 'No outcome-bearing successor is automatically authorized after E3v2 query 12 FAIL. Maintain the validated shelf; wait for a separately motivated result-free identity or the frozen Gap-Fill V2 true-fresh date gate.'
          reg['blackbox_ledger_query_count'] = 12
          reg['production_authority'] = False
          dump(REG, reg)

          print(json.dumps({'authority':'1.31','ledger':12,'e3v2':'FAIL','active_research':None,'production_authority':False}, sort_keys=True))
          PY
      - name: Commit synchronized governance pointers
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/current_authority_v1.json docs/governance/overnight_factor_product_registry_v1.json
          git diff --cached --quiet && { echo 'No governance changes staged'; exit 1; }
          git commit -m "Synchronize authority after E3v2 query 12 closure [skip ci]"
          git push