name: overnight-domestic-night-source-audit

on:
  push:
    branches:
      - codex/overnight-domestic-night-20260905
    paths:
      - 'scripts/audit_domestic_night_transport_source.py'
      - 'docs/governance/domestic_night_source_validation_preregistration.json'
      - '.github/workflows/overnight_domestic_night_source_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-domestic-night-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-audit dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Audit fixed CU/RB/I transport-source sample without target labels
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_domestic_night_transport_source.py | tee domestic_night_transport_source_audit.log
      - name: Upload source-audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: overnight-domestic-night-source-audit
          path: |
            docs/governance/domestic_night_source_validation_preregistration.json
            artifacts/research/domestic_night_transport_source_audit.json
            domestic_night_transport_source_audit.log
          if-no-files-found: error
          retention-days: 90
