name: overnight-domestic-night-v7-forensics

on:
  push:
    branches:
      - codex/overnight-domestic-night-v7-20260906
    paths:
      - 'scripts/audit_global_spillover_v7_fixed_forensics.py'
      - 'docs/governance/global_spillover_v7_forensic_diagnostic_plan.json'
      - '.github/workflows/overnight_domestic_night_v7_forensics.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: overnight-domestic-night-v7-forensics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install forensic dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scikit-learn
      - name: Download immutable formal v7 artifact
        uses: actions/download-artifact@v4
        with:
          name: overnight-domestic-night-v7-final
          path: artifacts/input/v7_formal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33999245962
      - name: Run fixed-prediction forensic diagnostics without refit
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_global_spillover_v7_fixed_forensics.py \
            --formal-result artifacts/input/v7_formal/artifacts/research/global_spillover_v7_domestic_night_results.json \
            | tee global_spillover_v7_fixed_forensics.log
      - name: Upload forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: overnight-domestic-night-v7-forensics
          path: |
            artifacts/research/global_spillover_v7_fixed_forensics.json
            global_spillover_v7_fixed_forensics.log
            docs/governance/global_spillover_v7_forensic_diagnostic_plan.json
          if-no-files-found: error
          retention-days: 90
