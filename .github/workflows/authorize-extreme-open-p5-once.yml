name: Authorize exact extreme-open P5 reusable query once
on:
  push:
    branches: ['research/overnight-extreme-p5-authorize']
    paths: ['.github/workflows/authorize-extreme-open-p5-once.yml']
permissions:
  contents: write
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Bind exact frozen P5 query authority without execution
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          identity='overnight_extreme_open_callable_state_reusable_validation_v1'
          protocol='docs/governance/extreme_open_callable_state_reusable_validation_v1_protocol.json'
          state_path='docs/governance/extreme_open_callable_state_reusable_validation_v1_state.json'
          runner='scripts/run_extreme_open_callable_state_reusable_validation.py'
          p4_protocol='docs/governance/extreme_open_callable_state_packaging_v1_protocol.json'
          p4_impl='scripts/extreme_open_callable_state.py'
          def sha(path): return hashlib.sha256((root/path).read_bytes()).hexdigest()
          bindings={
            'protocol_sha256':sha(protocol),
            'runner_sha256':sha(runner),
            'p4_protocol_sha256':sha(p4_protocol),
            'p4_reference_implementation_sha256':sha(p4_impl)
          }
          sp=root/state_path; st=json.loads(sp.read_text())
          if st.get('status')!='FROZEN_NOT_YET_QUERIED' or st.get('blackbox_opened') is not False:
              raise SystemExit('P5 state is not cleanly frozen/not-queried')
          st.update({
            'status':'AUTHORIZED_NOT_YET_QUERIED',
            'blackbox_open_authorized':True,
            'blackbox_opened':False,
            'frozen_bindings':bindings,
            'authorization_date':'2026-09-14'
          })
          sp.write_text(json.dumps(st,indent=2,ensure_ascii=False)+'\n')

          ap=root/'docs/governance/current_authority_v1.json'; a=json.loads(ap.read_text()); p=a['planned_research']
          p.update({
            'status':'P5_REUSABLE_VALIDATION_AUTHORIZED_NOT_YET_QUERIED',
            'active_execution_authority':True,
            'reusable_blackbox_2021_2025_open_authorized':True,
            'P5_reusable_validation_open_authorized':True,
            'P5_frozen_bindings':bindings,
            'next_gate':'execute exactly one reusable BLACKBOX query for the frozen P5 identity; only PASS/FAIL/INSUFFICIENT may be persisted or printed'
          })
          a['active_research']={
            'identity':identity,
            'status':'AUTHORIZED_NOT_YET_QUERIED',
            'protocol':protocol,
            'state':state_path,
            'runner':runner,
            'p4_protocol':p4_protocol,
            'p4_reference_implementation':p4_impl,
            'blackbox_window':'2021-01-01..2025-12-31',
            'public_output':['PASS','FAIL','INSUFFICIENT'],
            'frozen_bindings':bindings,
            'reusable_blackbox_2021_2025_open_authorized':True,
            'P6_authorized':False,
            'consumer_integration_authority':False,
            'account_execution_authority':False,
            'production_authority':False
          }
          a['next_action']='Execute exactly one frozen P5 reusable BLACKBOX query and persist only the overall PASS/FAIL/INSUFFICIENT receipt; do not inspect or publish state-level behavior.'
          rule='P5 is authorized for exactly one low-bandwidth reusable 2021-2025 query of the frozen six-state package. No protocol/runner/P4 mutation, row-level output, state-level metric/decision, failure attribution, rescue search, P6 consumer integration, account execution or production action is authorized.'
          if rule not in a['hard_rules']: a['hard_rules'].append(rule)
          ap.write_text(json.dumps(a,indent=2,ensure_ascii=False)+'\n')

          rp=root/'docs/governance/overnight_factor_product_registry_v1.json'; r=json.loads(rp.read_text())
          for product in r['products']:
              if product.get('product_id')=='OFP-A5':
                  product['status']='P5_reusable_validation_authorized_not_queried'
                  product['reusable_validation_authorized']=True
                  product['reusable_validation_opened']=False
                  product['validated_product_authority']=False
                  product['production_authority']=False
          r['active_research_identity']=identity
          r['active_research_status']='AUTHORIZED_NOT_YET_QUERIED'
          r['next_research_identity']=None
          r['next_research_note']='Execute exactly one frozen P5 reusable query; public output only PASS/FAIL/INSUFFICIENT.'
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          qp=root/'scripts/check_repository_consistency.py'; text=qp.read_text()
          # Make the global reusable-window guard status-aware, then add the exact P5 authorized-state checks.
          old_guard="""        if planned.get('reusable_blackbox_2021_2025_open_authorized') is not False:\n            errors.append('extreme-open plan improperly opens reusable 2021-2025 BLACKBOX')\n"""
          new_guard="""        p5_authorized_status = planned.get('status') == 'P5_REUSABLE_VALIDATION_AUTHORIZED_NOT_YET_QUERIED'\n        expected_reusable_open = True if p5_authorized_status else False\n        if planned.get('reusable_blackbox_2021_2025_open_authorized') is not expected_reusable_open:\n            errors.append('extreme-open reusable 2021-2025 BLACKBOX authority drift')\n"""
          if old_guard in text:
              text=text.replace(old_guard,new_guard,1)
          marker="""        elif plan_status == 'P5_REUSABLE_VALIDATION_FROZEN_QUERY_NOT_YET_AUTHORIZED':\n            if planned.get('active_execution_authority') is not False or a.get('active_research') is not None:\n                errors.append('extreme-open frozen P5 improperly grants query execution')\n            if planned.get('P5_identity') != 'overnight_extreme_open_callable_state_reusable_validation_v1' or planned.get('P5_exact_state_count') != 6:\n                errors.append('extreme-open P5 identity/state-count drift')\n            if planned.get('P5_public_output') != 'PASS_FAIL_INSUFFICIENT_only' or planned.get('P5_blackbox_window') != '2021-01-01_to_2025-12-31':\n                errors.append('extreme-open P5 output/window drift')\n            if planned.get('P5_reusable_validation_open_authorized') is not False or planned.get('reusable_blackbox_2021_2025_open_authorized') is not False:\n                errors.append('extreme-open P5 freeze improperly opens reusable BLACKBOX')\n            if planned.get('P4_combined_probability_authority') is not False or planned.get('P4_three_way_state_authority') is not False:\n                errors.append('extreme-open P5 freeze mutates P4 overlap boundary')\n"""
          addition=marker+"""        elif plan_status == 'P5_REUSABLE_VALIDATION_AUTHORIZED_NOT_YET_QUERIED':\n            active=a.get('active_research') or {}\n            if planned.get('active_execution_authority') is not True or active.get('identity') != 'overnight_extreme_open_callable_state_reusable_validation_v1':\n                errors.append('extreme-open P5 query authority identity drift')\n            if planned.get('P5_reusable_validation_open_authorized') is not True or planned.get('reusable_blackbox_2021_2025_open_authorized') is not True:\n                errors.append('extreme-open P5 exact query authority missing')\n            if active.get('protocol') != 'docs/governance/extreme_open_callable_state_reusable_validation_v1_protocol.json' or active.get('runner') != 'scripts/run_extreme_open_callable_state_reusable_validation.py':\n                errors.append('extreme-open P5 protocol/runner binding drift')\n            if active.get('blackbox_window') != '2021-01-01..2025-12-31' or active.get('public_output') != ['PASS','FAIL','INSUFFICIENT']:\n                errors.append('extreme-open P5 window/public-output drift')\n            if active.get('frozen_bindings') != planned.get('P5_frozen_bindings'):\n                errors.append('extreme-open P5 frozen-binding mismatch')\n            for path,key in [('docs/governance/extreme_open_callable_state_reusable_validation_v1_protocol.json','protocol_sha256'),('scripts/run_extreme_open_callable_state_reusable_validation.py','runner_sha256'),('docs/governance/extreme_open_callable_state_packaging_v1_protocol.json','p4_protocol_sha256'),('scripts/extreme_open_callable_state.py','p4_reference_implementation_sha256')]:\n                if hashlib.sha256((root/path).read_bytes()).hexdigest() != active.get('frozen_bindings',{}).get(key):\n                    errors.append('extreme-open P5 frozen byte binding drift: '+path)\n            st=load(root,'docs/governance/extreme_open_callable_state_reusable_validation_v1_state.json')\n            if st.get('status') != 'AUTHORIZED_NOT_YET_QUERIED' or st.get('blackbox_open_authorized') is not True or st.get('blackbox_opened') is not False:\n                errors.append('extreme-open P5 state authorization drift')\n            if active.get('P6_authorized') is not False or active.get('consumer_integration_authority') is not False or active.get('account_execution_authority') is not False or active.get('production_authority') is not False:\n                errors.append('extreme-open P5 authority exceeds reusable validation boundary')\n"""
          if marker not in text: raise SystemExit('P5 frozen QA block not found')
          text=text.replace(marker,addition,1)
          qp.write_text(text)
          PY
          python scripts/check_repository_consistency.py --write-views
          rm -f .github/workflows/authorize-extreme-open-p5-once.yml
      - name: Commit query authority transition
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'p5: authorize exact extreme-open reusable query [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
