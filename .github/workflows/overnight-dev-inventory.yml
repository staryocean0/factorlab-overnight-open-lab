name: overnight-dev-inventory

on:
  push:
    paths:
      - 'scripts/inventory_development.py'
      - '.github/workflows/overnight-dev-inventory.yml'
      - 'docs/governance/cloud_session_20260906_data_usage.json'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Validate bounded package
        run: python scripts/validate_theme_package.py
      - name: Run regression tests
        run: pytest -q
      - name: Development-only inventory
        run: python scripts/inventory_development.py
