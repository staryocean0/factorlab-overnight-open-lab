name: P0 extreme-open DEV materializer one-shot
on:
  push:
    branches: ['research/overnight-extreme-carrier-p0']
    paths: ['.github/workflows/materialize-extreme-open-dev-once.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Synthetic contract tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_extreme_open_vnext_materializer.py
      - name: Materialize all preregistered sufficient statistics without adjudication
        run: python scripts/materialize_extreme_open_dev_carrier.py --repo-root . --out data/extreme_open_vnext_dev_sufficient_statistics_v1.json
      - name: Commit deterministic carrier to this branch only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/extreme_open_vnext_dev_sufficient_statistics_v1.json data/extreme_open_vnext_dev_sufficient_statistics_v1.json.sha256
          git commit -m 'data: materialize extreme-open DEV sufficient statistics [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
