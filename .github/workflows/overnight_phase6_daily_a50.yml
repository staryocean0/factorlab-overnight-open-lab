name: overnight-phase6-daily-a50

on:
  push:
    branches:
      - codex/overnight-next-explained-20260905
    paths:
      - 'scripts/sgx_cn_tick.py'
      - 'scripts/refresh_external_sgx_a50_ordinary_year.py'
      - 'scripts/combine_external_sgx_a50_ordinary.py'
      - 'scripts/research_global_spillover_v6_daily_a50.py'
      - 'tests/test_sgx_cn_tick.py'
      - 'docs/governance/global_spillover_v6_daily_a50_preregistration.json'
      - 'docs/governance/global_spillover_v6_sgx_legacy_schema_correction.json'
      - '.github/workflows/overnight_phase6_daily_a50.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overnight-phase6-daily-a50-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract_year:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction dependencies
        run: python -m pip install --upgrade pandas pyarrow
      - name: Extract official SGX A50 ordinary endpoints for ${{ matrix.year }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/refresh_external_sgx_a50_ordinary_year.py \
            --year ${{ matrix.year }} \
            --workers 4 \
            --output-dir artifacts/staging/a50_ordinary \
            | tee a50_ordinary_${{ matrix.year }}.log
      - name: Upload compact yearly A50 evidence
        uses: actions/upload-artifact@v4
        with:
          name: a50-ordinary-${{ matrix.year }}
          path: |
            artifacts/staging/a50_ordinary/a50_ordinary_endpoints_${{ matrix.year }}.csv
            artifacts/staging/a50_ordinary/a50_ordinary_manifest_${{ matrix.year }}.json
            artifacts/staging/a50_ordinary/a50_ordinary_navigation_${{ matrix.year }}.json
            a50_ordinary_${{ matrix.year }}.log
          if-no-files-found: error
          retention-days: 90

  aggregate_and_research:
    needs: extract_year
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scikit-learn pytest
      - name: Download yearly A50 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: a50-ordinary-*
          path: artifacts/staging/a50_ordinary_combined
          merge-multiple: true
      - name: Combine and validate ordinary A50 external dataset
        shell: bash
        run: |
          set -o pipefail
          python scripts/combine_external_sgx_a50_ordinary.py \
            --input-dir artifacts/staging/a50_ordinary_combined \
            | tee a50_ordinary_combine.log
      - name: Validate bounded package
        run: python scripts/validate_theme_package.py
      - name: Run full tests
        run: pytest -q
      - name: Freeze compact ordinary A50 assets on successor branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/external/sgx_a50_ordinary_preauction_endpoints_2015_2020.csv \
            data/development/sgx_a50_ordinary_preauction_endpoints.parquet \
            data/external/sgx_historical_date_index_used_ordinary_2015_2020.json \
            docs/governance/external_sgx_a50_ordinary_preauction_2015_2020_manifest.json \
            data/manifest.json
          if git diff --cached --quiet; then
            echo "Ordinary A50 compact assets already frozen."
          else
            git commit -m "data: freeze ordinary SGX A50 preauction endpoints through 2020 [skip ci]"
            git push origin HEAD:codex/overnight-next-explained-20260905
          fi
      - name: Replay frozen baseline
        run: python scripts/replay_baseline.py
      - name: Replay authoritative v3 complete U.S. clock
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_global_spillover_v3_complete_clock.py | tee phase6_v3_replay.log
      - name: Replay corrected v4 HKMA increment
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_global_spillover_v4_cnh.py | tee phase6_v4_replay.log
      - name: Run preregistered v6 ordinary A50 experiment
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_global_spillover_v6_daily_a50.py | tee global_spillover_v6_daily_a50.log
      - name: Upload final phase6 ordinary A50 research evidence
        uses: actions/upload-artifact@v4
        with:
          name: overnight-phase6-daily-a50-final
          path: |
            docs/governance/global_spillover_v6_daily_a50_preregistration.json
            docs/governance/global_spillover_v6_sgx_legacy_schema_correction.json
            docs/governance/external_sgx_a50_ordinary_preauction_2015_2020_manifest.json
            data/external/sgx_a50_ordinary_preauction_endpoints_2015_2020.csv
            data/external/sgx_historical_date_index_used_ordinary_2015_2020.json
            artifacts/research/global_spillover_v6_daily_a50_results.json
            artifacts/staging/a50_ordinary_combined/a50_ordinary_manifest_*.json
            a50_ordinary_combine.log
            phase6_v3_replay.log
            phase6_v4_replay.log
            global_spillover_v6_daily_a50.log
          if-no-files-found: error
          retention-days: 90
