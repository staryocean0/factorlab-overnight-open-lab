name: P0 extreme-open finalizer one-shot
on:
  push:
    branches: ['research/overnight-extreme-carrier-p0']
    paths: ['.github/workflows/finalize-extreme-open-p0-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Register final P0 files and remove temporary execution surface
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.')
          p=root/'docs/governance/repository_lifecycle_v1.json'
          x=json.loads(p.read_text())
          maintained=['scripts/extreme_open_vnext_core.py','scripts/materialize_extreme_open_dev_carrier.py','tests/test_extreme_open_vnext_materializer.py']
          frozen=['data/extreme_open_vnext_dev_sufficient_statistics_v1.json','data/extreme_open_vnext_dev_sufficient_statistics_v1.json.sha256']
          wanted=set(maintained+frozen)
          x['files']=[r for r in x['files'] if r['path'] not in wanted]
          x['files'] += [{'path':q,'lifecycle':'maintained'} for q in maintained]
          for q in frozen:
              blob=subprocess.check_output(['git','hash-object',q],text=True).strip()
              x['files'].append({'path':q,'lifecycle':'data_provenance_only','frozen_blob':blob})
          x['files'].sort(key=lambda r:r['path'])
          p.write_text(json.dumps(x,indent=2,ensure_ascii=False)+'\n')
          PY
          rm -f scripts/_p0_probe.txt
          rm -f .github/workflows/materialize-extreme-open-dev-once.yml
          rm -f .github/workflows/finalize-extreme-open-p0-once.yml
      - name: Commit final P0 infrastructure state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'p0: finalize extreme-open DEV carrier infrastructure [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
