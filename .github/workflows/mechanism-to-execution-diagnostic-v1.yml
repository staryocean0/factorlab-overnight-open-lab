name: Mechanism to execution diagnostic v1

on:
  push:
    branches:
      - codex/unified-parent-state-router-20260908
    paths:
      - '.github/workflows/mechanism-to-execution-diagnostic-v1.yml'
      - 'scripts/run_rmr_mechanism_to_execution_diagnostic_v1.py'
      - 'tests/test_rmr_mechanism_to_execution_diagnostic_v1.py'
      - 'docs/research/rmr_mechanism_to_execution_diagnostic_v1_preanalysis_20260908.md'
      - 'docs/governance/rmr_R1_reusable_blackbox_parameter_freeze_v1.json'
      - 'docs/governance/rmr_R2_range_integrity_v2_parameter_freeze.json'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn pytest
      - name: Test frozen diagnostic boundaries
        run: python -m pytest -q tests/test_rmr_mechanism_to_execution_diagnostic_v1.py
      - name: Run DEV and VALIDATION diagnostic only
        run: |
          python scripts/run_rmr_mechanism_to_execution_diagnostic_v1.py \
            --output /tmp/rmr_mechanism_to_execution_diagnostic_v1.json
      - name: Enforce no BLACKBOX and no selection output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/rmr_mechanism_to_execution_diagnostic_v1.json').read_text())
          assert p['max_read_day'] == '2025-12-31'
          assert p['BLACKBOX_opened'] is False
          assert p['BLACKBOX_query_created'] is False
          assert p['selection_or_strategy_optimization_performed'] is False
          assert p['refit_performed'] is False
          assert p['production_authority'] is False
          assert p['round_trip_cost_bps_for_diagnostic'] == 10.0
          assert p['structural_resolution_horizon_bars'] == 1200
          assert p['fixed_markout_horizons'] == [1, 5, 15, 30, 60, 120, 240]
          assert set(p['cells']) == {'R1_A', 'R1_B', 'R2_A', 'R2_B'}
          for cell in p['cells'].values():
              assert set(cell) == {'DEV', 'VALIDATION', 'VALIDATION_annual'}
              assert set(cell['VALIDATION_annual']) == {'2021','2022','2023','2024','2025'}
          print('DIAGNOSTIC_GOVERNANCE_CONTRACT_OK')
          PY
      - name: Upload detailed DEV VALIDATION receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-to-execution-diagnostic-v1
          path: /tmp/rmr_mechanism_to_execution_diagnostic_v1.json
          if-no-files-found: error
