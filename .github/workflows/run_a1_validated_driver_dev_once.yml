name: One-shot A1 validated-driver development
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run_a1_validated_driver_dev_once.yml']
permissions:
  contents: write
jobs:
  run-a1-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run frozen A1 Development diagnostic
        run: |
          set -euo pipefail
          test ! -e docs/research/cloud_expected_open_validated_driver_coordinates_v1_dev_diagnostic.json
          python scripts/run_expected_open_validated_driver_coordinates_v1_dev_cloud.py
      - name: Commit A1 Development receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/cloud_expected_open_validated_driver_coordinates_v1_dev_diagnostic.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/cloud_expected_open_validated_driver_coordinates_v1_dev_diagnostic.json$' || true)"; test -z "$EXTRA"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/cloud_expected_open_validated_driver_coordinates_v1_dev_diagnostic.json
          git commit -m "Record A1 validated-driver development diagnostic [skip ci]"
          git push
