name: Extreme-open P1/P2 DEV adjudication one-shot
on:
  push:
    branches: ['research/overnight-extreme-p1p2-results']
    paths: ['.github/workflows/run-extreme-open-p1p2-once.yml']
permissions:
  contents: write
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify frozen statistical kernel
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_extreme_open_univariate_stats.py
      - name: Execute exact authorized P1/P2 DEV adjudication
        run: python scripts/adjudicate_extreme_open_univariate_dev.py --repo-root . --out docs/research/extreme_open_univariate_dev_v1_receipt.json
      - name: Freeze execution artifacts and remove temporary workflow
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.')
          life_path=root/'docs/governance/repository_lifecycle_v1.json'; life=json.loads(life_path.read_text())
          rows={
            'scripts/extreme_open_univariate_stats.py':'frozen_implementation',
            'scripts/adjudicate_extreme_open_univariate_dev.py':'frozen_implementation',
            'tests/test_extreme_open_univariate_stats.py':'current_contract_regression',
            'docs/research/extreme_open_univariate_dev_v1_receipt.json':'historical_immutable'
          }
          life['files']=[r for r in life['files'] if r['path'] not in rows]
          for path,lifecycle in rows.items():
              blob=subprocess.check_output(['git','hash-object',path],text=True).strip()
              life['files'].append({'path':path,'lifecycle':lifecycle,'frozen_blob':blob})
          life['files'].sort(key=lambda r:r['path']); life_path.write_text(json.dumps(life,indent=2,ensure_ascii=False)+'\n')
          PY
          rm -f .github/workflows/run-extreme-open-p1p2-once.yml
      - name: Commit immutable DEV receipt to result branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: record frozen extreme-open P1/P2 DEV receipt [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
