name: Extreme-open P3 post-result survivor summary one-shot
on:
  push:
    branches: ['research/overnight-extreme-p3-results']
    paths: ['.github/workflows/summarize-extreme-open-p3-postresult-once.yml']
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Print all frozen P3 survivors without ranking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/research/extreme_open_p3_intersections_dev_v1_receipt.json').read_text())
          print(json.dumps({'summary':r['summary'],'survivors':r['survivors']},indent=2,sort_keys=True))
          PY
      - name: Remove temporary summary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/summarize-extreme-open-p3-postresult-once.yml
          git commit -m 'chore: remove P3 post-result summary one-shot [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
