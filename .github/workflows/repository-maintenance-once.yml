name: Apply repository reconciliation (one shot)
on:
  push:
    branches: [maintenance/repository-consistency-20260912]
    paths: ['.github/workflows/repository-maintenance-once.yml']
permissions:
  contents: write
concurrency:
  group: repository-maintenance-20260912
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply reviewed source/metadata retirement plan
        run: python tools/reconcile_repository_20260912.py
      - name: Persist isolated reconciliation for review
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile documentation, frozen code, tests and workflow lifecycle [skip ci]'
          git push origin HEAD:maintenance/repository-consistency-20260912
      - name: Install exact QA environment
        run: python -m pip install -r requirements-ci.txt
      - name: Cross-surface consistency
        id: consistency
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/check_repository_consistency.py | tee "$RUNNER_TEMP/consistency.json"
      - name: Guarded regression
        id: regression
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set +e
          python -m pytest -q --junitxml="$RUNNER_TEMP/tests.xml"
          code=$?
          echo "$code" > "$RUNNER_TEMP/pytest.exit"
          exit "$code"
      - name: Record actual QA result
        if: always()
        env:
          QA_CONSISTENCY: ${{ steps.consistency.outcome }}
          QA_REGRESSION: ${{ steps.regression.outcome }}
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import json, os, subprocess, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          target = Path('docs/maintenance/20260912_verification.json')
          if not target.exists():
              raise SystemExit('Reconciliation did not complete; no fabricated verification receipt')
          temp = Path(os.environ['RUNNER_TEMP'])
          result = {'status':'PASS' if os.environ['QA_CONSISTENCY']=='success' and os.environ['QA_REGRESSION']=='success' else 'FAIL','checked_source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'python':sys.version.split()[0],'consistency_step':os.environ['QA_CONSISTENCY'],'regression_step':os.environ['QA_REGRESSION'],'production_authority':False,'new_scientific_query_created':False,'market_or_account_rows_opened':False,'versions':{p:md.version(p) for p in ['numpy','pandas','scipy','scikit-learn','pyarrow','pytest','PyYAML']}}
          if (temp/'consistency.json').exists():
              try: result['consistency']=json.loads((temp/'consistency.json').read_text())
              except ValueError: result['consistency_parse_error']=True
          if (temp/'tests.xml').exists():
              xml=ET.parse(temp/'tests.xml').getroot()
              cases=list(xml.iter('testcase'))
              result['test_cases']=len(cases)
              result['failures']=[{'test':c.get('classname','')+'::'+c.get('name',''),'reason':n.get('message','')[:1000]} for c in cases for n in list(c) if n.tag in {'failure','error'}]
          target.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git add docs/maintenance/20260912_verification.json
          git commit -m 'Record actual guarded maintenance QA result [skip ci]'
          git push origin HEAD:maintenance/repository-consistency-20260912
      - name: Require successful checks
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('docs/maintenance/20260912_verification.json').read_text())['status']=='PASS'
          PY
