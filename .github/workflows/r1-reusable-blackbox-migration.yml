name: R1 reusable blackbox migration

on:
  push:
    branches:
      - codex/reusable-blackbox-governance-20260908
    paths:
      - '.github/workflows/r1-reusable-blackbox-migration.yml'
      - 'scripts/run_rmr_R1_reusable_dev_validation.py'
      - 'scripts/certify_rmr_R1_reusable_blackbox.py'
      - 'tests/test_reusable_three_role_blackbox.py'
      - 'docs/governance/reusable_three_role_data_policy_v1.json'
      - 'docs/governance/reversal_mean_reversion_R1_reusable_blackbox_protocol_v1.json'

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn pytest
      - name: Test reusable blackbox boundaries
        run: python -m pytest -q tests/test_reusable_three_role_blackbox.py
      - name: Run DEV validation and freeze final fit
        run: |
          python scripts/run_rmr_R1_reusable_dev_validation.py \
            --receipt /tmp/r1_validation_receipt.json \
            --freeze /tmp/r1_blackbox_parameter_freeze.json
      - name: Run low-bandwidth blackbox certification
        id: blackbox
        shell: bash
        run: |
          set +e
          python scripts/certify_rmr_R1_reusable_blackbox.py \
            --freeze /tmp/r1_blackbox_parameter_freeze.json \
            --receipt /tmp/r1_blackbox_receipt.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            echo "blackbox infrastructure failure"
            exit "$code"
          fi
          echo "scientific_exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Enforce low-bandwidth receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/r1_blackbox_receipt.json').read_text())
          allowed={
            'schema_id','research_identity','query_id','candidate_fingerprint',
            'protocol_fingerprint','blackbox_source_fingerprint','blackbox_window',
            'decision','details_released','exact_metrics_released','counts_released',
            'subperiods_released','event_rows_released','blackbox_remains_closed',
            'repeated_query_is_independent_OOS','production_authority'
          }
          assert set(p)==allowed, sorted(set(p)-allowed)
          assert p['decision'] in {'PASS','FAIL','INSUFFICIENT'}
          assert p['details_released'] is False
          assert p['exact_metrics_released'] is False
          assert p['counts_released'] is False
          assert p['subperiods_released'] is False
          assert p['event_rows_released'] is False
          print(p['decision'])
          PY
      - name: Upload bounded receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-reusable-blackbox-migration
          path: |
            /tmp/r1_validation_receipt.json
            /tmp/r1_blackbox_parameter_freeze.json
            /tmp/r1_blackbox_receipt.json
          if-no-files-found: warn
