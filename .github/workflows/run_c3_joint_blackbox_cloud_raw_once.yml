name: One-shot C3 joint BLACKBOX from raw text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_c3_joint_blackbox_cloud_raw_once.yml'

permissions:
  contents: write

jobs:
  run-c3-joint-blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Verify raw carriers and run frozen C3 joint BLACKBOX
        run: |
          test ! -e docs/research/local_previous_session_last_hour_conditioned_open_state_joint_blackbox_receipt_v1.json
          python scripts/run_previous_session_last_hour_conditioned_open_state_joint_blackbox_cloud_raw.py
      - name: Commit compact receipt only
        run: |
          git status --short
          test -f docs/research/local_previous_session_last_hour_conditioned_open_state_joint_blackbox_receipt_v1.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/local_previous_session_last_hour_conditioned_open_state_joint_blackbox_receipt_v1.json$' || true)"
          test -z "$EXTRA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/local_previous_session_last_hour_conditioned_open_state_joint_blackbox_receipt_v1.json
          git commit -m "Record C3 joint reusable BLACKBOX receipt [skip ci]"
          git push
