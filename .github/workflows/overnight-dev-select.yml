name: overnight-dev-select

on:
  push:
    paths:
      - 'scripts/select_clock_candidates_dev.py'
      - '.github/workflows/overnight-dev-select.yml'
      - 'docs/governance/cloud_session_20260906_candidate_family_v1.json'

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Validate bounded package
        run: python scripts/validate_theme_package.py
      - name: Run regression tests
        run: pytest -q
      - name: Select development-only candidate
        run: python scripts/select_clock_candidates_dev.py
