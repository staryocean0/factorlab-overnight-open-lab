name: One-shot B2 China-offshore reusable BLACKBOX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run_b2_china_offshore_blackbox_once.yml']
permissions:
  contents: write
jobs:
  run-b2-blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Reconstruct panel and run compact B2 BLACKBOX
        run: |
          set -euo pipefail
          test ! -e docs/research/local_china_offshore_open_gap_blackbox_receipt_v1.json
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
          python scripts/build_v6a_frozen_base_panel.py \
            --raw-panel data/high_open_dev_2015_2025/annotated_panel.parquet \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --nasdaq data/high_open_dev_2015_2025/fred_nasdaq.csv \
            --vix data/high_open_dev_2015_2025/fred_vix.csv \
            --frozen-panel data/development/csi1000_open_pit_panel.parquet \
            --panel-out "$TMP/panel.parquet" \
            --nasdaq-normalized-out "$TMP/nasdaq.csv" \
            --vix-normalized-out "$TMP/vix.csv"
          python scripts/run_single_external_driver_blackbox.py \
            --panel "$TMP/panel.parquet" \
            --hkma data/v6a_external_sources_2015_2025/hkma_usdcny_cross.parquet \
            --holiday-a50 data/v6a_external_sources_2015_2025/sgx_a50_holiday_endpoints.parquet \
            --ordinary-a50 data/v6a_external_sources_2015_2025/sgx_a50_ordinary_preauction_endpoints.parquet \
            --high-open-source-manifest data/high_open_dev_2015_2025/manifest.json \
            --external-source-manifest data/v6a_external_sources_2015_2025/manifest.json \
            --reconstruction-contract docs/governance/v6a_base_panel_reconstruction_contract_20260910.json \
            --protocol docs/governance/china_offshore_open_gap_blackbox_protocol_v1.json \
            --receipt-out docs/research/local_china_offshore_open_gap_blackbox_receipt_v1.json
      - name: Commit compact B2 receipt only
        run: |
          set -euo pipefail
          git status --short
          test -f docs/research/local_china_offshore_open_gap_blackbox_receipt_v1.json
          EXTRA="$(git status --short | grep -v '^?? docs/research/local_china_offshore_open_gap_blackbox_receipt_v1.json$' || true)"; test -z "$EXTRA"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/local_china_offshore_open_gap_blackbox_receipt_v1.json
          git commit -m "Record B2 reusable BLACKBOX receipt [skip ci]"
          git push
