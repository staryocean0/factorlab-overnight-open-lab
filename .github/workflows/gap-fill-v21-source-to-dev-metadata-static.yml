name: gap-fill-v21-source-to-dev-metadata-static

on:
  push:
    branches:
      - codex/v21-source-to-dev-metadata-controller
  pull_request:
    paths:
      - 'scripts/run_v21_source_to_dev_metadata_controller.py'
      - 'tests/test_gap_fill_v21_source_to_dev_metadata_controller.py'
      - 'docs/governance/cloud_session_20260907_gap_fill_v21_source_to_dev_metadata_controller_v1.json'
      - '.github/workflows/gap-fill-v21-source-to-dev-metadata-static.yml'

permissions:
  contents: read

jobs:
  static-metadata-controller-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static dependencies
        run: python -m pip install pytest pandas pyarrow
      - name: Compile controller
        run: python -m py_compile scripts/run_v21_source_to_dev_metadata_controller.py
      - name: Run controller tests
        run: python -m pytest -q tests/test_gap_fill_v21_source_to_dev_metadata_controller.py
      - name: Confirm hard stop before DEV outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/governance/cloud_session_20260907_gap_fill_v21_source_to_dev_metadata_controller_v1.json').read_text())
          text = Path('scripts/run_v21_source_to_dev_metadata_controller.py').read_text()
          assert p['hard_stop_after_outputs'] is True
          assert p['V21_DEV_outcomes_open_authorized'] is False
          assert p['successor_model_fit_authorized'] is False
          assert p['successor_model_selection_authorized'] is False
          assert 'LogisticRegression' not in text
          assert 'v21_p2_overlay' not in text
          assert 'v21_evaluation_kernel' not in text
          assert '.fit(' not in text
          print('metadata controller remains pre-outcome only')
          PY
