name: Execute exact extreme-open P5 reusable validation once
on:
  push:
    branches: ['research/overnight-extreme-p5-result']
    paths: ['.github/workflows/execute-extreme-open-p5-once.yml']
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact frozen dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify merged query authority and frozen bindings
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          state=json.loads(Path('docs/governance/extreme_open_callable_state_reusable_validation_v1_state.json').read_text())
          auth=json.loads(Path('docs/governance/current_authority_v1.json').read_text())
          assert state['status']=='AUTHORIZED_NOT_YET_QUERIED'
          assert state['blackbox_open_authorized'] is True and state['blackbox_opened'] is False
          active=auth['active_research']
          assert active['identity']=='overnight_extreme_open_callable_state_reusable_validation_v1'
          assert auth['planned_research']['status']=='P5_REUSABLE_VALIDATION_AUTHORIZED_NOT_YET_QUERIED'
          assert auth['planned_research']['reusable_blackbox_2021_2025_open_authorized'] is True
          b=state['frozen_bindings']
          assert sha('docs/governance/extreme_open_callable_state_reusable_validation_v1_protocol.json')==b['protocol_sha256']
          assert sha('scripts/run_extreme_open_callable_state_reusable_validation.py')==b['runner_sha256']
          assert sha('docs/governance/extreme_open_callable_state_packaging_v1_protocol.json')==b['p4_protocol_sha256']
          assert sha('scripts/extreme_open_callable_state.py')==b['p4_reference_implementation_sha256']
          PY
      - name: Reconstruct exact panel then execute compact P5 query
        shell: bash
        run: |
          set -euo pipefail
          TMPROOT="${RUNNER_TEMP}/extreme_open_p5"
          mkdir -p "$TMPROOT"
          python scripts/build_v6a_frozen_base_panel.py \
            --raw-panel data/high_open_dev_2015_2025/annotated_panel.parquet \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --nasdaq data/high_open_dev_2015_2025/fred_nasdaq.csv \
            --vix data/high_open_dev_2015_2025/fred_vix.csv \
            --frozen-panel data/development/csi1000_open_pit_panel.parquet \
            --panel-out "$TMPROOT/frozen_panel_2015_2025.parquet" \
            --nasdaq-normalized-out "$TMPROOT/fred_nasdaq_normalized.csv" \
            --vix-normalized-out "$TMPROOT/fred_vix_normalized.csv" \
            >/dev/null
          python scripts/run_extreme_open_callable_state_reusable_validation.py \
            --panel "$TMPROOT/frozen_panel_2015_2025.parquet" \
            --hkma data/v6a_external_sources_2015_2025/hkma_usdcny_cross.parquet \
            --holiday-a50 data/v6a_external_sources_2015_2025/sgx_a50_holiday_endpoints.parquet \
            --ordinary-a50 data/v6a_external_sources_2015_2025/sgx_a50_ordinary_preauction_endpoints.parquet \
            --high-open-source-manifest data/high_open_dev_2015_2025/manifest.json \
            --external-source-manifest data/v6a_external_sources_2015_2025/manifest.json \
            --reconstruction-contract docs/governance/v6a_base_panel_reconstruction_contract_20260910.json \
            --p4-protocol docs/governance/extreme_open_callable_state_packaging_v1_protocol.json \
            --protocol docs/governance/extreme_open_callable_state_reusable_validation_v1_protocol.json \
            --receipt-out docs/research/local_extreme_open_callable_state_reusable_validation_v1_receipt.json
      - name: Verify low-bandwidth receipt only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/research/local_extreme_open_callable_state_reusable_validation_v1_receipt.json')
          x=json.loads(p.read_text())
          assert x['research_identity']=='overnight_extreme_open_callable_state_reusable_validation_v1'
          assert x['decision'] in {'PASS','FAIL','INSUFFICIENT'}
          for k in ['public_detail_release','state_level_decisions_persisted','internal_metrics_persisted','counts_persisted','yearly_results_persisted','failure_attribution_persisted','probability_breakdowns_persisted']:
              assert x[k] is False
          forbidden={'metrics','states','state_results','by_year','by_quarter','counts','dates','events','probabilities','failure_attribution','gate_failures'}
          assert not (forbidden & set(x))
          print(x['decision'])
          PY
      - name: Commit compact receipt and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/execute-extreme-open-p5-once.yml
          git add docs/research/local_extreme_open_callable_state_reusable_validation_v1_receipt.json
          git commit -m 'p5: record exact reusable validation receipt [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
