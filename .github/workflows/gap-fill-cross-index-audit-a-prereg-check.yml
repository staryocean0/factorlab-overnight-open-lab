name: gap-fill-cross-index-audit-a-prereg-check

on:
  push:
    paths:
      - '.github/workflows/gap-fill-cross-index-audit-a-prereg-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scipy scikit-learn pytest
      - name: Verify Audit-A preregistered blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/governance/cloud_session_20260907_gap_fill_cross_index_audit_a_protocol_v1.json)" = "5fa17d9c92863be37636699082d13547e47956fd"
          test "$(git hash-object scripts/evaluate_gap_fill_cross_index_audit_a.py)" = "e55f7aeb73523a20105337bd7c7a80dd335e040e"
          test "$(git hash-object tests/test_gap_fill_cross_index_audit_a_protocol.py)" = "fc672e99b0a7ea30d8cf472ba45ebe6eee8cbeac"
          test "$(git hash-object docs/governance/local_gap_fill_cross_index_transport_dev_parameter_freeze_v1.json)" = "4cce91f54a0dbbf1380f12db24db4c1d2c0c3162"
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_v2_final_fit_freeze_v1.json)" = "eef7a9af6d42ee2faf53dbd16dce0b15ebfd10ed"
      - name: Compile Audit-A evaluator only
        run: python3 -m py_compile scripts/evaluate_gap_fill_cross_index_audit_a.py
      - name: Validate theme package
        run: python3 scripts/validate_theme_package.py
      - name: Run full regression tests
        run: python3 -m pytest -q
      - name: Assert Audit-A and later outcomes remain unopened
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/research/local_gap_fill_cross_index_transport_audit_a_receipt_v1.json
          test ! -e docs/governance/local_gap_fill_cross_index_transport_audit_a_data_usage_v1.json
          test ! -e docs/research/local_gap_fill_cross_index_transport_audit_b_receipt_v1.json
          echo 'Audit-A preregistration valid; 2011-2012 outcomes remain unopened.'
