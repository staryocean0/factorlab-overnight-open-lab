name: global-spillover-research

on:
  push:
    branches:
      - codex/overnight-global-spillover-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Validate bounded package
        run: python scripts/validate_theme_package.py
      - name: Run tests
        run: pytest -q
      - name: Replay frozen baseline
        run: python scripts/replay_baseline.py
      - name: Run preregistered spillover candidates
        run: python scripts/research_global_spillover_v1.py | tee global_spillover_v1.log
      - name: Upload research receipt
        uses: actions/upload-artifact@v4
        with:
          name: global-spillover-v1-results
          path: |
            artifacts/research/global_spillover_v1_results.json
            global_spillover_v1.log
          if-no-files-found: error
