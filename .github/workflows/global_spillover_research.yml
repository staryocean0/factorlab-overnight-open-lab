name: global-spillover-research

on:
  push:
    branches:
      - codex/overnight-global-spillover-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Validate bounded package
        run: python scripts/validate_theme_package.py
      - name: Run tests
        run: pytest -q
      - name: Replay frozen baseline
        run: python scripts/replay_baseline.py
      - name: Replay preregistered spillover v1
        run: python scripts/research_global_spillover_v1.py | tee global_spillover_v1.log
      - name: Diagnose baseline US feature transforms and calendars
        run: python scripts/diagnose_us_feature_clock_alignment.py | tee us_feature_clock_alignment.log
      - name: Localize US feature mismatches
        run: python scripts/diagnose_us_feature_clock_mismatches.py | tee us_feature_clock_mismatches.log
      - name: Attribute v1 gain to source-clock mismatch
        run: python scripts/audit_global_spillover_v1_clock_mismatch_attribution.py | tee global_spillover_v1_clock_mismatch_attribution.log
      - name: Upload diagnostic receipts
        uses: actions/upload-artifact@v4
        with:
          name: global-spillover-us-clock-forensic
          path: |
            artifacts/research/global_spillover_v1_results.json
            artifacts/research/us_feature_clock_alignment_diagnostic.json
            artifacts/research/us_feature_clock_mismatches.json
            artifacts/research/global_spillover_v1_clock_mismatch_attribution.json
            global_spillover_v1.log
            us_feature_clock_alignment.log
            us_feature_clock_mismatches.log
            global_spillover_v1_clock_mismatch_attribution.log
          if-no-files-found: error
