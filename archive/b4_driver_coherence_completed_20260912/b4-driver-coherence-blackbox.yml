name: b4-driver-coherence-blackbox

on:
  push:
    paths:
      - '.github/workflows/b4-driver-coherence-blackbox.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install --quiet pandas numpy pyarrow scikit-learn
      - name: Reconstruct frozen panel and run compact BLACKBOX
        shell: bash
        run: |
          set -euo pipefail
          TMPROOT="${RUNNER_TEMP}/b4_driver_coherence_blackbox"
          mkdir -p "$TMPROOT"
          python scripts/build_v6a_frozen_base_panel.py \
            --raw-panel data/high_open_dev_2015_2025/annotated_panel.parquet \
            --minute-bars data/high_open_dev_2015_2025/1m_official.parquet \
            --nasdaq data/high_open_dev_2015_2025/fred_nasdaq.csv \
            --vix data/high_open_dev_2015_2025/fred_vix.csv \
            --frozen-panel data/development/csi1000_open_pit_panel.parquet \
            --panel-out "$TMPROOT/frozen_panel_2015_2025.parquet" \
            --nasdaq-normalized-out "$TMPROOT/fred_nasdaq_normalized.csv" \
            --vix-normalized-out "$TMPROOT/fred_vix_normalized.csv" \
            >/dev/null
          python scripts/run_driver_coherence_open_gap_blackbox.py \
            --panel "$TMPROOT/frozen_panel_2015_2025.parquet" \
            --hkma data/v6a_external_sources_2015_2025/hkma_usdcny_cross.parquet \
            --holiday-a50 data/v6a_external_sources_2015_2025/sgx_a50_holiday_endpoints.parquet \
            --ordinary-a50 data/v6a_external_sources_2015_2025/sgx_a50_ordinary_preauction_endpoints.parquet \
            --source-manifest data/v6a_external_sources_2015_2025/manifest.json \
            --reconstruction-contract docs/governance/v6a_base_panel_reconstruction_contract_20260910.json \
            --protocol docs/governance/driver_coherence_open_gap_blackbox_protocol_v1.json \
            --receipt-out docs/research/local_driver_coherence_open_gap_blackbox_receipt_v1.json
      - name: Verify compact receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/research/local_driver_coherence_open_gap_blackbox_receipt_v1.json')
          x = json.loads(p.read_text())
          assert x['decision'] in {'PASS','FAIL','INSUFFICIENT'}
          assert x['research_identity'] == 'overnight_driver_coherence_open_gap_v1'
          assert x['public_detail_release'] is False
          assert x['internal_metrics_persisted'] is False
          assert x['yearly_results_persisted'] is False
          assert x['counts_persisted'] is False
          assert x['failure_attribution_persisted'] is False
          forbidden = {'metrics','by_year','by_quarter','counts','dates','events','partial_corr','r2','sse','ic','sign_accuracy','failure_attribution'}
          assert not (forbidden & set(x))
          PY
      - name: Commit compact BLACKBOX receipt only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/local_driver_coherence_open_gap_blackbox_receipt_v1.json
          git diff --cached --name-only | grep -qx 'docs/research/local_driver_coherence_open_gap_blackbox_receipt_v1.json'
          git commit -m 'Record B4 reusable BLACKBOX receipt [skip ci]'
          git push
