name: overnight-data-source-probe

on:
  push:
    paths:
      - '.github/workflows/overnight-data-source-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install --upgrade pandas pyarrow
      - name: Probe frozen DataHub 1m provenance only
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path('data/development/1m_official.parquet')
          df=pd.read_parquet(p)
          print('ROWS', len(df))
          print('COLUMNS', list(df.columns))
          print('DTYPES', {c:str(df[c].dtype) for c in df.columns})
          for c in df.columns:
              lc=c.lower()
              if any(k in lc for k in ['source','provider','vendor','contract','origin','freq','symbol','adjust','calendar','timestamp']):
                  vals=df[c].dropna().astype(str).unique()
                  print('META', c, 'NUNIQUE', len(vals), 'VALUES', vals[:20].tolist())
          clocks=df['timestamp'].astype(str).str.slice(11,16) if 'timestamp' in df.columns else pd.Series([],dtype=str)
          if len(clocks):
              print('CLOCK_SAMPLE', sorted(clocks.unique())[:20], sorted(clocks.unique())[-20:])
          print('DAY_RANGE', str(df['trading_day'].min()), str(df['trading_day'].max()))
          sample=df.loc[df['trading_day'].astype(str).isin(['2015-01-05','2020-12-31'])].copy()
          if 'timestamp' in sample.columns:
              sample=sample.loc[sample['timestamp'].astype(str).str.slice(11,16).isin(['09:31','13:01','14:00','15:00'])]
          keep=[c for c in ['trading_day','timestamp','timestamp_source_serialized','symbol','open','high','low','close','source','provider','vendor'] if c in sample.columns]
          print('SAMPLE_ROWS')
          print(sample[keep].to_string(index=False))
          PY
