name: gap-fill-v2-phase1-factor-diagnostic

on:
  push:
    paths:
      - '.github/workflows/gap-fill-v2-phase1-factor-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scipy scikit-learn pytest
      - name: Verify frozen code identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/governance/cloud_session_20260906_gap_fill_v2_phase1_factor_diagnostic_protocol_v1.json)" = "8a86089cf767ed0d30057ab75c8a74ac084ce38b"
          test "$(git hash-object scripts/diagnose_gap_fill_v2_phase1_factors.py)" = "b8fd0fe00b7f6b753de7420cac3a6caf21862a1f"
          test "$(git hash-object tests/test_gap_fill_v2_phase1_factor_diagnostic.py)" = "65b98b09d8c697fc2d8484acb63979bc456ae1b6"
      - name: Verify frozen data identities
        shell: bash
        run: |
          set -euo pipefail
          echo 'f2587a528a517052016b646b58c734569b64a87766ff096575f353587e46aed1  data/high_open_dev_2015_2025/annotated_panel.parquet' | sha256sum -c -
          echo '11f4a5e78381371680fbcf6e01891216f645a8de869646ced6a623970727bcce  data/high_open_dev_2015_2025/1m_official.parquet' | sha256sum -c -
          echo '045cf728977ff72a9fabd236aaf06b7a9df3310ad1f6f487bd594d487cc05ffd  data/offshore_etf_dev_2015_2025/offshore_etf_daily.parquet' | sha256sum -c -
      - name: Validate package
        run: python3 scripts/validate_theme_package.py
      - name: Run regression tests
        run: python3 -m pytest -q
      - name: Run frozen Phase-1 factor diagnostic
        run: python3 scripts/diagnose_gap_fill_v2_phase1_factors.py
      - name: Verify evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/research/cloud_session_20260906_gap_fill_v2_phase1_factor_diagnostic_receipt_v1.json')
          u = Path('docs/governance/cloud_session_20260906_gap_fill_v2_phase1_factor_data_usage_v1.json')
          assert p.exists() and u.exists()
          d = json.loads(p.read_text())
          assert d['v1_reference_fitting_performed'] is True
          assert d['v1_reference_fits_used_gap_fill_outcomes'] is False
          assert d['gap_fill_model_fitting_performed'] is False
          assert d['candidate_selection_performed'] is False
          assert d['feature_selection_performed'] is False
          assert d['threshold_search_performed'] is False
          assert d['2026_rows_loaded'] is False
          assert d['probe_count'] == 10
          print(json.dumps({
              'n_common_complete_rows': d['n_common_complete_rows'],
              'common_inventory_by_sign': d['common_inventory_by_sign'],
              'mechanism_passer_count': d['mechanism_passer_count'],
              'mechanism_passers': d['mechanism_passers'],
              'factor_block_summary': d['factor_block_summary'],
              '2026_rows_loaded': d['2026_rows_loaded'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit aggregate Phase-1 receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gap-fill-v2-phase1-cloud-runner'
          git config user.email 'gap-fill-v2-phase1-cloud-runner@users.noreply.github.com'
          git add \
            docs/research/cloud_session_20260906_gap_fill_v2_phase1_factor_diagnostic_receipt_v1.json \
            docs/governance/cloud_session_20260906_gap_fill_v2_phase1_factor_data_usage_v1.json
          if git diff --cached --quiet; then
            echo 'No Phase-1 receipt changes.'
          else
            git commit -m 'Record cloud gap-fill V2 Phase-1 factor diagnostic [skip ci]'
            git push origin HEAD:main
          fi
