name: overnight-holdout-v1

on:
  push:
    paths:
      - 'scripts/evaluate_frozen_holdout_v1.py'
      - '.github/workflows/overnight-holdout-v1.yml'
      - 'docs/governance/cloud_session_20260906_selected_spec_v1.json'

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Validate bounded package
        run: python scripts/validate_theme_package.py
      - name: Run regression tests
        run: pytest -q
      - name: Evaluate frozen holdout exactly once
        run: python scripts/evaluate_frozen_holdout_v1.py
