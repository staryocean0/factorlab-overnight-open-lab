name: gap-fill-v21-session-complete-239-gate

on:
  push:
    branches:
      - codex/v21-session-complete-239-source-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run pure gate self-test
        run: python scripts/v21_session_complete_239_gate.py --self-test
      - name: Run V21 gate tests only
        run: python -m pytest -q tests/test_v21_session_complete_239_gate.py
      - name: Confirm frozen RD1 runner is still historical-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/diagnose_gap_fill_v21_regime_consumed.py').read_text(encoding='utf-8')
          assert 'CONSUMED_END = "2014-10-16"' in text
          assert 'columns=["symbol", "trading_day", "timestamp"]' in text
          assert 'V21_DEV_outcomes_opened": False' in text
          print('RD1 runner remains frozen/historical-only')
          PY
      - name: Report external receipt visibility without opening outcomes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/research/local_gap_fill_v21_future_audit_source_admission_receipt_v1.json')
          print({'local_source_admission_receipt_visible_in_checkout': p.exists()})
          PY
