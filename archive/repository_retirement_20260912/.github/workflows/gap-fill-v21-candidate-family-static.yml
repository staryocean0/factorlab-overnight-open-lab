name: gap-fill-v21-candidate-family-static

on:
  push:
    branches:
      - codex/v21-p2-candidate-family-freeze
  pull_request:
    paths:
      - 'docs/governance/cloud_session_20260907_gap_fill_v21_candidate_family_v1.json'
      - 'docs/governance/cloud_session_20260907_gap_fill_v21_dev_selection_protocol_v1.json'
      - 'docs/research/gap_fill_v21_candidate_family_preanalysis_20260907.md'
      - 'scripts/v21_p2_overlay.py'
      - 'tests/test_gap_fill_v21_candidate_family.py'

permissions:
  contents: read

jobs:
  static-family-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static test dependencies
        run: python -m pip install pytest numpy scipy
      - name: Parse frozen JSON protocols
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('docs/governance/cloud_session_20260907_gap_fill_v21_candidate_family_v1.json'),
              Path('docs/governance/cloud_session_20260907_gap_fill_v21_dev_selection_protocol_v1.json'),
              Path('docs/governance/gap_fill_v21_state_v1.json'),
          ]:
              json.loads(p.read_text(encoding='utf-8'))
              print('parsed', p)
          PY
      - name: Run V21 candidate-family tests only
        run: python -m pytest -q tests/test_gap_fill_v21_candidate_family.py
      - name: Confirm no future execution was authorized
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          family = json.loads(Path('docs/governance/cloud_session_20260907_gap_fill_v21_candidate_family_v1.json').read_text())
          dev = json.loads(Path('docs/governance/cloud_session_20260907_gap_fill_v21_dev_selection_protocol_v1.json').read_text())
          state = json.loads(Path('docs/governance/gap_fill_v21_state_v1.json').read_text())
          assert family['V21_DEV_outcomes_open_authorized'] is False
          assert dev['DEV_outcomes_opened'] is False
          assert dev['successor_fit_performed'] is False
          assert dev['successor_selection_performed'] is False
          assert state['sealed']['V21_DEV_outcomes'] is True
          assert state['sealed']['V21_AUDIT_A_outcomes'] is True
          assert state['sealed']['V21_AUDIT_B_outcomes'] is True
          assert state['successor_model_fit_authorized'] is False
          assert state['successor_model_selection_authorized'] is False
          print('future outcome boundary remains sealed')
          PY
