name: ohr08-offshore-china-frozen-base-overlay

on:
  push:
    paths:
      - '.github/workflows/ohr08-offshore-china-frozen-base-overlay.yml'

permissions:
  contents: write

jobs:
  ohr08:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Verify frozen OHR-05 source
        run: |
          echo '045cf728977ff72a9fabd236aaf06b7a9df3310ad1f6f487bd594d487cc05ffd  data/offshore_etf_dev_2015_2025/offshore_etf_daily.parquet' | sha256sum -c -
      - name: Validate theme package
        run: python3 scripts/validate_theme_package.py
      - name: Run full regression tests
        run: python3 -m pytest -q
      - name: Run frozen OHR-08 selector
        run: python3 scripts/select_offshore_china_ohr08_frozen_base_overlay_dev.py
      - name: Verify frozen-base and evidence boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/research/cloud_session_20260906_cloud_offshore_china_ohr08_dev_receipt_v1.json')
          u = Path('docs/governance/cloud_session_20260906_offshore_china_ohr08_data_usage.json')
          assert p.exists() and u.exists()
          d = json.loads(p.read_text())
          a = d['attempts'][0]
          assert len(d['attempts']) == 1
          assert d['candidate_selection_performed'] is True
          assert d['parameter_search_performed'] is False
          assert d['beta_grid_search_performed'] is False
          assert d['threshold_search_performed'] is False
          assert d['quantile_search_performed'] is False
          assert d['2026_rows_loaded'] is False
          assert d['2026_blackbox_opened'] is False
          assert d['ohr_03_opened'] is False
          assert a['stage1_reference_score_max_abs_difference'] <= 1e-12
          assert a['non_tail_score_max_abs_difference'] <= 1e-12
          assert a['non_tail_predictions_identical'] is True
          print(json.dumps({
              'n_oof_common': d['n_oof_common'],
              'eligible_candidate_count': d['eligible_candidate_count'],
              'decision': d['decision'],
              'selected': d['selected'],
              'stage1_reference_score_max_abs_difference': a['stage1_reference_score_max_abs_difference'],
              'non_tail_score_max_abs_difference': a['non_tail_score_max_abs_difference'],
              '2026_blackbox_opened': d['2026_blackbox_opened'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit aggregate OHR-08 receipts
        run: |
          git config user.name 'ohr08-cloud-runner'
          git config user.email 'ohr08-cloud-runner@users.noreply.github.com'
          git add \
            docs/research/cloud_session_20260906_cloud_offshore_china_ohr08_dev_receipt_v1.json \
            docs/governance/cloud_session_20260906_offshore_china_ohr08_data_usage.json
          if git diff --cached --quiet; then
            echo 'No receipt changes.'
          else
            git commit -m 'Record cloud OHR-08 frozen-base overlay receipt [skip ci]'
            git push origin HEAD:main
          fi
