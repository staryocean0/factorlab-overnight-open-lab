name: gap-fill-v21-regime-rd1-prereg-check

on:
  push:
    paths:
      - 'docs/governance/cloud_session_20260907_gap_fill_v21_regime_diagnostic_protocol_v1.json'
      - 'scripts/diagnose_gap_fill_v21_regime_consumed.py'
      - 'tests/test_gap_fill_v21_regime_diagnostic_protocol.py'
      - '.github/workflows/gap-fill-v21-regime-rd1-prereg-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scipy scikit-learn pytest
      - name: Verify V2.1 RD1 preregistered blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/governance/cloud_session_20260907_gap_fill_v21_regime_diagnostic_protocol_v1.json)" = "81348fbdde35a8ccab634cd01ef783820243a1d1"
          test "$(git hash-object scripts/diagnose_gap_fill_v21_regime_consumed.py)" = "d5512b9037631cb9e07cd1c680a35c11ec14ea44"
          test "$(git hash-object tests/test_gap_fill_v21_regime_diagnostic_protocol.py)" = "194571b15f325caeb9a26761d96df220d17ecab3"
          test "$(git hash-object docs/governance/local_gap_fill_cross_index_transport_dev_parameter_freeze_v1.json)" = "4cce91f54a0dbbf1380f12db24db4c1d2c0c3162"
          test "$(git hash-object docs/research/gap_fill_cross_index_audit_b_cloud_adjudication_20260907.md)" = "8902756ac8a8b266969c07029908a852d4a146c7"
      - name: Compile V2.1 RD1 runner only
        run: python3 -m py_compile scripts/diagnose_gap_fill_v21_regime_consumed.py
      - name: Validate theme package
        run: python3 scripts/validate_theme_package.py
      - name: Run full regression tests
        run: python3 -m pytest -q
      - name: Assert RD1 and future outcomes remain unopened
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/research/local_gap_fill_v21_regime_diagnostic_receipt_v1.json
          test ! -e docs/governance/local_gap_fill_v21_regime_diagnostic_data_usage_v1.json
          test ! -e docs/research/local_gap_fill_cross_index_transport_supporting_crosscheck_receipt_v1.json
          test ! -e docs/research/local_gap_fill_v21_dev_receipt_v1.json
          test ! -e docs/research/local_gap_fill_v21_audit_a_receipt_v1.json
          test ! -e docs/research/local_gap_fill_v21_audit_b_receipt_v1.json
          echo 'V2.1 RD1 preregistration valid; future external outcomes remain unopened.'
